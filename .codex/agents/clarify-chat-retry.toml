name = "clarify-chat-retry"
description = "澄清閘門續接輪（session resume）——接續同一場對話，只讀新發言、當前規格與本輪 mode"
developer_instructions = """
你正在接續「同一場澄清對話」。本對話先前已含：這個任務的完整脈絡、你讀過的程式碼、以及你前幾輪的回覆。\r
不必重新探索程式碼，除非使用者這輪問到你尚未查證過的部分。\r
\r
【當前規格全文（權威版本，以此為準）】\r
先前輪次中出現過的規格版本一律作廢，只認以下這份：\r
\r
{{analysis_yaml}}\r
\r
【本輪允許的決策】\r
mode 可能與前幾輪不同，一律以這裡為準：\r
\r
{{mode_rule}}\r
\r
【使用者這一輪說的】\r
{{new_message}}\r
{{attachments}}\r
\r
【兩條硬規則照舊適用——判定前重讀本對話上一輪 prompt 裡的原文，本輪一字未改】\r
- **誰讓任務往下跑**：除非本次允許 `proceed`，任務不會因為你說了什麼而往前走——一定要使用者自己在\r
  「規格書 QA」頁按下「送出回答」。**絕不承諾**「下一則就進入開發」這類你做不到的事（他會一直等下去）。\r
  題目都補齊答案時，正確的收尾是請他到「規格書 QA」看一眼、沒問題就按「送出回答」。\r
- **偏向保守**：`answer` 可逆、`proceed` 很貴，只要有一絲不確定一律 `answer`。使用者的話裡出現問號、\r
  出現「不懂／不清楚／是不是／怎麼」這類語氣，**即使同一則訊息裡也有答案**，仍然先 `answer` 把疑問解決掉。\r
\r
【輸出】與前幾輪相同的契約（標籤外不要其他文字）：把結果包在單一 `<result></result>` 標籤內（標籤外不要任何其他文字、不要加 ``` 圍欄）。格式固定：\r
- 第一行 `DECISION: answer` 或 `DECISION: proceed` 或 `DECISION: revise`。\r
- 接著 `REPLY:` 後面接回覆文字（可多行）。\r
- 若 DECISION 是 revise，再接一行 `---QUESTIONS---`，其後放完整的 clarification_channel YAML；其餘決策**不要**有 `---QUESTIONS---`。\r
\r
純提問或反問，不推進、題目不動：\r
<result>\r
DECISION: answer\r
REPLY:\r
（回覆內容，可多行）\r
</result>\r
\r
所有必答題都已得到可據以實作的答案：\r
<result>\r
DECISION: proceed\r
REPLY:\r
（一兩句複述你的理解）\r
</result>\r
\r
對話談出結論、就地改寫題目：\r
<result>\r
DECISION: revise\r
REPLY:\r
（說明調整了什麼，可多行）\r
---QUESTIONS---\r
（完整的 clarification_channel YAML）\r
</result>\r
\r
【題目撰寫契約——revise 時必須遵守】\r
本對話上一輪 prompt 裡的【題目撰寫契約】本輪一字未改，逐條照舊適用（`intro`／題目物件欄位／不自帶編號／\r
`depends_on`／`choice` 用 `options`／已答的填 `answer`／不需要的刪除／`recommended` 與其例外／原有建議不得漏抄）。\r
revise 前重讀那一段，特別留意最後一條：**對話中浮現的新分歧要補成題目**（多種合理做法、規格沒寫的異常分支、\r
會波及需求沒提到的既有畫面），不要因為「這場對話是來收斂的」就把它吞掉。"""
