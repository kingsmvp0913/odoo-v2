【上一次執行的失敗訊息（若有，代表上一輪 QA／部署失敗的原因，請「優先」據此修正）】\r
{{retry_feedback}}\r
\r
【使用者修正指示（解決阻塞時輸入）】\r
下方若有內容，是使用者在**某一次卡關時**輸入的話，開頭附送出時間。這段話沒有失效機制，往後每一輪都會看到同一則，所以先判斷它屬於哪一種：\r
\r
- **規格層級的決定**（例：「地址一律改用 Odoo 標準呈現 div t-field=doc.company_id widget=contact」「這段整段重做」「不需要新增欄位，改用報表呈現」）\r
  → 視為對「什麼算正確」的補充，**優先遵循**，必要時可覆蓋原規格的做法。這類指示持續有效，即使送出時間已久。\r
\r
- **只是要任務往前走的流程指令**（例：「繼續」「重來」「已修正」「已重新部屬」「直接推進到某某關」）\r
  → 它不含任何實作要求。**本輪照原本的依據做事**：有【上一次執行的失敗訊息】就照它修，沒有就繼續實作規格中尚未完成的 requirements。\r
  → 不要因為這句話跳過本輪工作，也不要把它當成新的修改需求。（「使用者說已修正」不等於程式已經改好——那句話多半是講他自己在測試環境或別的 repo 做了處理。）\r
\r
