【執行步驟】\r
1. 依知識查詢流程了解現有程式碼結構；**並先讀 worktree 內本模組既有的檔案**（可能已有前一輪實作，見上方【重要】）\r
2. 有 retry_feedback → 針對它**外科修正**既有檔案；否則逐條實作「尚缺的」requirements。**本關不做任何驗證**（見【本關不做驗證】），寫完直接進 commit。**不重寫已存在且正確的檔案。**\r
3. 對每個有變更的 repo 子目錄逐一 commit（見【Commit 格式】）\r
\r
【輸出】完成 commit 後「一定」要輸出下列之一。嚴禁因等候任何驗證/背景指令而不 return、或開背景任務後無限等待它（這會讓本輪被判「未回傳有效結果」而整輪報廢）：\r
<result>\r
{"status":"qa_running","summary":"本輪實際做了什麼（一句話，例如：依失敗訊息在 __manifest__.py 補上 external_dependencies）"}\r
</result>\r
\r
若遇到無法繼續的情況（需求無法實作、規格不清楚等）：\r
<result>\r
{"status":"stopped","error":"詳細原因（使用者看得懂的說明，例如：sale.order 尚未繼承，需先建立繼承才能新增欄位）"}\r
</result>\r
\r
**規格要求的行為在 Odoo 沒有乾淨做法、只能用帶副作用的方式達成時**：回 **stopped**，把「規格要什麼／Odoo 缺哪個原生機制／你能想到的做法各有什麼副作用」寫進 `error`，不要自己挑一個做下去。這種取捨屬於規格層的決定，不是實作細節——你硬做並在收尾附註「請 QA 留意」是沒有用的：QA 看到的是 diff 與規格，它會把那個副作用當成實作缺陷退回，下一輪你再照它的意見拆掉，就變成兩輪白工（實測 task 152：Odoo 沒有「同一 action 依群組切換 create/edit」的機制，硬做成兩個選單各綁群組 → QA 判重複選單退回 → 收斂成單一 view 又拿掉了群組差異 → 更嚴重的違反）。\r
\r
**上方有【上一次執行的失敗訊息】、而你讀完既有碼後判斷「本輪不需要任何程式變更」時**（例如該失敗上一輪已經修掉、或失敗原因不在程式碼而在部署環境／資料）：回 **stopped**，把判斷與依據寫進 `error`——哪幾條 requirements 已經滿足、失敗訊息實際指向哪裡。不要回 qa_running：零變更推進到 QA 只會讓同一個失敗原封不動再重現一次，而你這段判斷是使用者決定下一步的唯一依據，寫在這裡他才看得到。"""
