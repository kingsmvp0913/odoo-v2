    --accent: #a5b4fc;
    --accent-soft: #25263a;
    --code-bg: #2a2a2a;

  .rail {
    position: sticky;

    align-self: start;
    height: 100vh;
    overflow-y: auto;

    background: var(--surface);

    text-decoration: none;

  .doc pre code { font-family: var(--font-mono); font-size: 13px; white-space: pre; }

  .table-wrap {
    margin: 0 0 20px;
    overflow-x: auto;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--surface);

  .doc table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.65; }
  .doc th, .doc td { text-align: left; vertical-align: top; padding: 9px 14px; border-bottom: 1px solid var(--rule); }
  .doc th { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; background: var(--ground); white-space: nowrap; }
  .doc tbody tr:last-child td { border-bottom: 0; }
  .doc td:first-child { font-variant-numeric: tabular-nums; }

  .doc h2.is-decision { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .doc h2.is-decision::after {
    content: attr(data-count);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--decide-ink);

    padding-top: 16px;

    .doc h1 { font-size: 25px; }

<script>
  const DOCS = [{"id":"overview","num":"","label":"總覽","deps":"從這裡開始","file":"2026-09-11-productize-overview.md","md":"# 平台產品化總覽（SaaS 多租戶）\n\n日期：2026-09-11\n狀態：子專案 0～4 的原始設計與 09-14／09-15 裁決已彙整；**這不代表產品化程式已完成**，進度、阻擋條件與新發現的待裁決事項以「開發順序」§0 為準\n⚠ 2026-09-23 起，這些文件與重產的 `docs/odoo-v2-saas-specs.html` 已納入版控；目前 GitHub repo 為公開。文件可能含內部環境與憑證資訊，公開範圍須先完成資安審查。\n\n2026-09-23 編修原則：本文件記**已裁決的目標設計**，不把「規格已寫」誤寫成「程式已做」。程式進度、驗證程度與開客戶前的阻擋條件只看「開發順序」§0。較晚的裁決優先於本文保留的 09-11 歷史現況。\n\n2026-09-23 核對：共用專案的任務依建立者公司隔離、對話只給本人，Wiki 仍依專案共享，這題已有較新實作與測試。新手教學也已依使用者裁決處置：「實際流程」課第 ⑤ 步對一般使用者保留教學但改指可見的動作區，管理員仍看執行歷程。**目前沒有這兩題的待裁決事項**；其餘工程與人工驗收待辦見「開發順序」§0。\n\n---\n\n## 1. 要做的事：五塊\n\n| # | 名稱 | 規格檔 | 一句話 | 前置 |\n|---|---|---|---|---|\n| 0 | 把 AI 關起來 | `2026-09-11-agent-sandbox-design.md` | 每次 AI 執行開一個用完就丟的容器，拿不到總鑰匙、別家資料、客戶憑證 | 無 |\n| 1 | 租戶隔離 | `2026-09-11-tenant-isolation-design.md` | 加「公司」，所有資料照公司切開，角色與頁面照裁決收斂 | 0 |\n| 2 | 客戶自帶 API key | `2026-09-11-byok-api-key-design.md` | 客戶的 AI 用客戶自己的 key，平台不代付；單張任務有花費上限 | 0、1 |\n| 3 | 客戶按到底 | `2026-09-11-customer-self-serve-flow-design.md` | 客戶自己回答問題、確認規格、驗收、上正式 | 0、1、2 |\n| 4 | 上線營運 | `2026-09-11-saas-operations-design.md` | 開通、訂閱、平台更版、備份、容量、監控、客戶離開、條款 | 大部分在 3 之後 |\n\n### 順序\n\n```\n0 ──► 1 ──► 2 ──► 3 ──► 4（其餘）\n                        \n4.4 平台 DB 備份 ── 不依賴任何一塊，可以現在就做\n```\n\n**為什麼 0 一定最先（2026-09-11 的設計理由）**：當時 AI 子行程繼承平台環境變數，能取得總鑰匙。容器路徑後來已上線，但舊無容器路徑仍待移除；不得把當時的「現在每一次」當成目前正式環境的描述。切換狀態見「開發順序」§0。\n\n---\n\n## 2. 已定調的決定（照時間）\n\n| 日期 | 決定 | 落在哪份 |\n|---|---|---|\n| 09-10 | 一套系統多家客戶共用（SaaS） | 全部 |\n| 09-11 | 客戶自己按到底，包含上正式機 | 3 |\n| 09-11 | AI 費用：客戶自帶 API key，不找 Anthropic 談轉售 | 2 |\n| 09-11 | 上正式前 DB 備份曾擱置；**已被 09-14 裁決取代** | 3 P4 |\n| 09-11 | 開通由平台管理員代設 | 1、4 |\n| 09-11 | 一家公司多帳號，分公司管理員／一般使用者 | 1 |\n| 09-11 | 客戶只看得到問答、任務、Wiki | 1 |\n| 09-11 | 隔離方式：每次執行一個用完就丟的容器（不用 tmux、不用常駐容器） | 0 |\n| 09-11 | 健檢、夜間改善 AI 也關進容器，權限比客戶大 | 0 |\n| 09-11 | 夜間改善＝客戶提建議的管道，要有更版機制、不能馬上上線 | 4 |\n| 09-11 | Codex 只留內部，客戶只用 Claude | 0、2 |\n| 09-11 | 帳號只綁公司 | 1 |\n| 09-11 | 平台管理員以外的人只保留問答、任務、Wiki、個人設定，其餘工具改平台管理員限定 | 1 |\n| 09-11 | 公司可綁 GIT；個人有用個人，沒有用公司的；客戶也能填個人 GIT | 1、3 |\n| 09-11 | 公司有啟用開關＋使用期間，走訂閱制 | 1、4 |\n| 09-14 | 平台 DB 備份先放這台、留 14 天，之後再搬 | 4 O7 |\n| 09-14 | 不開 staging，改用功能開關＋正式平台上的測試帳號／測試公司驗證 | 開發順序 R3 |\n| 09-14 | 角色只有三種：平台管理員／公司管理員／一般使用者；內部人員＝「內部公司」成員 | 1 |\n| 09-14 | 專案可掛多家公司（多對多）；新建專案自動綁內部公司 | 1 |\n| 09-14 | 上正式看綁定上的「可上正式」勾選；內部公司不勾 | 1、3 |\n| 09-14 | AI 用發起的人所屬公司的 key（任務＝建任務的人） | 2 |\n| 09-14 | 客戶上正式前不備份 DB；確認視窗與條款必須明寫 | 3 P4、4 |\n| 09-15 | 提示詞注入：限制傷害範圍，不做過濾／偵測；hook 只當輔助 | 總覽 §6、0 |\n| 09-15 | R6：健檢提案改人工核准、改碼的 AI 查不到平台 DB；**夜間改善維持自動合併**（剩餘風險知情接受） | 總覽 §6.3、0 §4.5、4 §4.3、開發順序 0.5 |\n| 09-15 | 子專案 0 計畫 Q1：考試系統 AI 不進容器，只做 env 白名單 | 0、計畫第 2 部 2.11 |\n| 09-15 | Q2：改平台碼的內部 AI（platform_fix／fix_review／fix_verify／feedback_merge）不給 wiki／任務規格，只給術語表 | 0 §4.5、計畫 X12 |\n| 09-15 | Q3：Codex 先限內部人員（名單照常可選），客戶公司帳號觸發時一律 Claude——擋法需要公司表，落在子專案 1 `canRun`；Codex 容器化列後續 | 0 §4.6、1、計畫 2.12 |\n| 09-15 | Q4：加 git 分支守衛（AI 會自己 `git commit`，也就能移動 testing／main 繞過 QA；執行前後比對 refs，只准本任務分支變動） | 0、計畫第 3 部 3.13 |\n| 09-15 | Q5：子專案 0 的測試專案＝project 1「odoo17」 | 計畫第 3 部 M10、3.8 |\n| 09-16 | 階段 0.1（備份）、0.5（健檢提案人工核准）、**2c（測試區獨立 DB 帳號）全部完成並在正式平台驗證通過** | 開發順序 §0 |\n| 09-16 | 階段 1 開工：前置量測 M1／M2／M3 完成，23 個 agentType 與計畫相符 | 開發順序 §0 |\n| 09-21 | 考試系統不改為平台管理員專用，改用公司功能開關；客戶預設關閉 | 1、開發順序 §0 |\n| 09-23 | 新手教學「實際流程」第 ⑤ 步保留一般使用者版，但不得點管理員專用的執行歷程；管理員版不變 | 開發順序 §0 |\n\n---\n\n## 3. 我寫規格時自己做的設計選擇（討論時沒有逐一問過，請特別看）\n\n| # | 選擇 | 理由 | 在哪 |\n|---|---|---|---|\n| D1 | 客戶管理員存成**新的 role 值 `company_admin`**，不重用 `admin` | 程式裡至少 6 處自己判斷 `role === 'admin'`；重用的話漏改一處，客戶管理員就在那裡變成平台管理員。用新值，漏改只會少功能，不會多權限 | 1 §4.3 |\n| D2 | 看不到的專案、任務回 **404** 不回 403 | 回 403 等於告訴對方「這個 id 存在」 | 1 §5.2 |\n| D3 | 公司沒設 API key 時**絕不退回**用平台的認證 | 條款不允許；fallback 要指向最嚴格（rules/pipeline 59） | 2 §4.4 |\n| D4 | 內部 AI（健檢等）**不准查客戶正式 DB** | 你的裁決是「看得到全部任務」，沒有包含客戶正式資料 | 0 §4.4 |\n| D5 | 主 clone 的 `.git/config`、`.git/hooks` 掛成唯讀 | 可寫的話，AI 能埋指令，等平台在主機跑 git 時被執行＝從容器逃出來 | 0 §4.2 |\n| D6 | 容器的記憶體／CPU／程序數上限，**沒訂數值前一律擋下不准跑** | 不給「不設上限」這個預設 | 0 §4.2 |\n| D7 | 內部 AI 掛平台程式碼時用**乾淨的 git worktree**，不掛正在運作的平台資料夾 | 平台資料夾裡有 `data/config.json`（總鑰匙） | 0 §4.5 |\n| D8 | `/ai` 查詢從容器走 **unix socket**，不走網路 | 平台是 host 網路，從 IP 分不出是閘道還是 nginx 轉進來的外部請求 | 0 §3 |\n| D9 | 新增靜態守衛測試：以後新增的專案／任務路由沒做權限檢查就紅燈 | 11／12 支專案端點只驗登入就是這樣累積出來的 | 1 §5.4 |\n| D10 | 內部公司記號 `is_internal` **只在遷移時建一筆，任何 API 都不能設** | 客戶公司被誤標成內部，就會拿平台的訂閱跑客戶的 AI，違反條款 | 1 §4.1 |\n| D11 | 內部公司看得到全部專案**不寫特判**，純粹靠「全部都綁了」 | 權限只有一條規則（有綁才看得到），不會出現「內部例外」被濫用 | 1 §5.2 |\n\n---\n\n## 4. 已裁決事項（09-14 彙整；後續較新的處置見「開發順序」§0）\n\n### 子專案 1：租戶隔離\n\n| # | 問題 | 建議 |\n|---|---|---|\n| 1-P1 | 一般使用者看得到同公司別人的任務嗎？（共用專案時上正式會帶到別家任務） | **已決 09-14**：只看自己的 |\n| 1-P2 | 客戶的個人設定留不留 Odoo 帳密／同步設定？ | **已決 09-14**：隱藏 |\n| 1-P3 | 自助註冊？ | **已決 09-14**：關閉 |\n| 1-P4 | 平台管理員沒個人 GIT 時退回誰？ | **已決 09-14**：不退回，擋下 |\n| 1-P5 | 公司到期時正在跑的任務？ | **已決 09-14**：立刻中止（非我建議） |\n| 1-P6 | 客戶管理員能刪帳號嗎？ | **已決 09-14**：只能停用 |\n\n### 子專案 2：客戶自帶 API key\n\n| # | 問題 | 建議 |\n|---|---|---|\n| 2-P1 | 平台管理員能代填 key 嗎？ | **已決 09-14**：可代填，記 set_by |\n| 2-P2 | 單張任務上限預設值？ | **已決 09-14**：先用歷史 p90／p99 算再訂 |\n| 2-P3 | 客戶看得到花費嗎？ | **已決 09-14**：沿用用量報表加公司條件，開給公司管理員（強制自家） |\n| 2-P4 | 一家公司不同專案能用不同 key 嗎？ | **已決 09-14**：一家一把 |\n\n### 子專案 3：客戶按到底\n\n| # | 問題 | 建議 |\n|---|---|---|\n| 3-P1 | 合併衝突讓客戶處理嗎？ | **已決 09-14**：不讓，轉平台 |\n| 3-P2 | 失敗時給「請平台協助」按鈕嗎？ | **已決 09-14**：要 |\n| 3-P3 | 客戶進測試區的 Odoo 權限？ | **已決 09-14**：維持 admin＋必修測試區獨立 DB 帳號（1 §10） |\n| 3-P4 | 上正式前 DB 備份（擱置中） | **已決 09-14**：不備份，確認視窗與條款明寫 |\n| 3-P5 | 一般人看得到待上正式清單嗎？ | **已決 09-14**：看得到（唯讀） |\n\n### 子專案 4：上線營運\n\n| # | 問題 | 建議 |\n|---|---|---|\n| 4-O1 | 第一版串線上金流嗎？ | **已決 09-14**：不串 |\n| 4-O2 | 方案與價格 | **已決 09-14**：每家公司固定月費 |\n| 4-O3 | 到期前幾天通知？ | **已決 09-14**：14 天、3 天 |\n| 4-O4 | 解約後資料留多久？ | **已決 09-14**：不自動刪 |\n| 4-O5 | 離開前提供資料匯出嗎？ | **已決 09-14**：第一版不做 |\n| 4-O6 | 平台更版的維護時段與頻率 | **已決 09-14**：每週六、日 |\n| 4-O7 | ~~平台 DB 備份存哪、留幾天~~ | **已決 09-14**：先放這台、14 天 |\n| 4-O8 | 每家公司的同時執行上限 | **已決 09-14**：每家各自上限，數值等容量量完 |\n| 4-O9 | nginx 443 `default_server` 要重新評估嗎？ | **已決 09-14**：客戶上線前修＋評估客戶自有網域 |\n| 4-O10 | 服務條款誰擬？ | **已決 09-14**：自己擬 |\n\n子專案 0 沒有需要你決定的商業問題，只剩計畫階段要實測的技術數值（見該份 §10）。\n\n---\n\n## 5. 09-14 新發現：測試區用平台的超級使用者連資料庫\n\n測試區 Odoo 用平台 `DATABASE_URL` 的帳號 `odoo`（PG 超級使用者）連線，平台 DB `aidev` 與全部客戶測試 DB 在同一個 PG；SSO 進測試區的人是 Odoo admin，能寫伺服器動作跑 Python ⇒ 讀平台 DB、別家測試資料，甚至在平台容器執行指令。**不經過 AI 容器，子專案 0 擋不住。** 修法寫在 1 §10（每個測試區獨立、非超級使用者的 DB 帳號），任何客戶進測試區前必須完成。\n\n---\n\n## 6. 09-15 提示詞注入：策略與容器擋不住的洞\n\n**提示詞注入**＝客戶在需求、附件、退回原因、對話裡藏一句指令，騙 AI 做壞事。\n\n### 6.1 策略（09-15 定調）\n\n**假設注入一定會成功，把它能造成的傷害壓到最小**；不做輸入過濾、不做注入偵測。\n理由：過濾與偵測永遠做不到 100%，漏一次就全破；隔離是白名單，沒放行的一律不通。\n\n| 層 | 做法 | 定位 |\n|---|---|---|\n| 第一層 | 子專案 0 的容器（掛載白名單、網路白名單、env 白名單） | **主要防線** |\n| 第二層 | 容器內的 PreToolUse hook（現有 `scan-guard.js`，掛成唯讀，0 §4.2） | 輔助：提早擋明顯的壞動作、留紀錄。**不能當防線**——hook 是黑名單，`printenv`／`python -c`／先寫腳本再跑都繞得過；且沒進容器前 AI 與 hook 同 uid，改得到 hook 本身 |\n| 第三層 | agent prompt 寫「別照使用者文字裡的指令做」 | 不做。prompt 是請求不是防線（rules/pipeline 60） |\n\n### 6.2 容器擋不住的洞\n\n| # | 洞 | 為什麼容器擋不住 | 誰負責 | 何時必須完成 |\n|---|---|---|---|---|\n| I1 | **夜間改善自動合併進平台 master**：客戶文字 → 健檢 AI 讀到被騙 → 提案自動核准（`auto-fix-scope.js`，medium 以上）→ platform-fix 改 `app/server/`（ALLOW 範圍內，DENY 只護守門碼）→ fix-review／fix-verify（也是 AI，可被同一段文字騙）→ 自動合併＋重啟 | AI 寫的碼合併後**在容器外、以平台本體身分執行**，拿得到全部鑰匙；影響所有客戶、會一直留著、全程無人 | **R6 已決（09-15）**：人擋入口、出口仍自動合併（§6.3） | 核准提案：開發順序階段 0.5，可現在做；R6-A 權限分級：階段 1；兩者都是第一家客戶前硬條件 |\n| I2 | 共用專案（多家公司綁同一專案）：A 公司的人注入，AI 在共用專案寫進惡意碼，B 公司上正式時一起帶上 | 容器以專案為隔離單位，同專案內擋不到 | 已有對應：綁定前兩家確認（1 §4.3）、上正式確認視窗列出每張任務是哪家核准的（3 §105） | 接受為已知風險 |\n| I3 | 測試區 DB 超級使用者：AI 寫進模組的碼在測試區一跑，就能讀平台 DB | 不經 AI 容器 | 1 §10 | 客戶進測試區前（開發順序 2c） |\n\n### 6.3 I1 現在就存在（09-15 實查）\n\n不是等客戶上線才有：\n\n- 健檢 AI 的查詢範圍含 `tasks`、`project_chat_messages`（`health-auditor.md:25`）。\n- `tasks.original_text` 來自客戶在 eService 自己寫的 `question_description`（`sync.js:370`）。\n- 自動合併只看 `teams_settings.cli_push_user_id` 有沒有設（`nightly-fix.js:654`，這台已設）。\n\n**R6 裁決（09-15）：人擋入口，出口仍自動合併。**\n\n曾提出的另外兩條：清空 `cli_push_user_id` 停自動合併（截圖失敗會被 `ui-preview.js:205-209` 接住、不卡審核）、合併前要人按——**都不採用**。\n\n| 項 | 做法 | 在哪 |\n|---|---|---|\n| 入口 | 健檢提案**一律平台管理員核准**才進夜間改善（意見回饋本來就要核准）。現在自動核准的兩處：`health-check-runner.js:133`、`:238-251` | 開發順序 0.5 |\n| A | 改碼／審碼的 AI（`platform_fix`、`fix_verify`、`fix_review`、`feedback_merge`）**查不到平台 DB**，只讀得到核准過、放進 prompt 的文字；只有健檢 AI 能查 | 0 §4.5、開發順序階段 1 |\n| B | 合併後留紀錄可回查：diff、審核與複檢說明、commit | 4 §4.3 |\n| 核准頁 | 顯示**會送給 AI 的完整文字**，不是摘要 | 4 §4.3 |\n\n**使用者知情接受的剩餘風險**：人核准的是文字，合併的是程式。\n- 核准時沒看出全文裡藏的一句指令 → AI 照做 → 沒人看過 diff 就合併、在容器外執行。\n- 意見回饋是客戶原文整段交給 platform-fix（`platform-fix.md:17`），這是最可能藏指令的地方。\n- 出事時靠 B 回查、`git revert`。\n\n### 6.4 （已併入 §6.3）\n\n---\n\n## 7. 查證過程中被推翻的說法\n\n| 我原本說的 | 實際 |\n|---|---|\n| 「終端機頁」`Terminal.js` 很危險 | 它只是唯讀重播 AI 輸出，不是 shell |\n| 用量報表後端只驗登入 | 後端有另外查 admin（`token-report-routes.js:8-11`） |\n| 關卡端點沒有擋別人的任務 | 都經過 `loadTaskForActor`（本人或 admin） |\n"},{"id":"rollout","num":"","label":"開發順序","deps":"不影響現有平台的做法","file":"2026-09-11-productize-rollout-plan.md","md":"# 開發順序：不影響現有平台的做法\n\n日期：2026-09-11\n狀態：R1～R6 均已裁決；本文件 §0 是唯一程式進度來源，其餘「現況」若標 2026-09-11 即為歷史基線\n依據：總覽與子專案 0～4 規格；本文的「現況」全部是 2026-09-11 實查\n\n---\n\n## 0. 目前進度（最後核對 2026-09-24；整體估算仍沿用 09-22 晚）\n\n> **進度只算程式。**（2026-09-21 使用者裁決）條款、責任歸屬、產品名稱與 logo、訂閱收費這類事項**一律走合約，不列入本表的進度計算**。\n> 它們仍然是「開第一家客戶之前必須完成」的事，只是屬於合約工作，不是工程進度。清單見下方「合約要涵蓋的事（不算進度）」。\n\n**程式進度約 80%**（2026-09-22 深夜粗估，信心中低；09-24 新完成的訂閱到期提醒尚未重新估算整體比例，勿視為 09-24 精算值）。\n\n**09-24 接手紀錄**：階段 5 的訂閱到期提醒已完成程式：每小時掃描啟用中的客戶公司，到期前 14 天與 3 天各通知一次；平台管理員在「公司管理」、公司管理員在「公司帳號」頁會看到到期前 14 天內的持續警示。使用者裁決採方案 1，不重建個人收件匣。上一批排程與通知已在 `04ef33a2`；本次管理頁警示與本文件在本提交一併推送。相關 6 個測試套件 168 項通過；之後只改測試 query 的參數，又重跑 2 套 25 項通過。全套 Jest 在 Windows 仍因 PostgreSQL `pgPass is not a function` 未完成，不能標成全套通過。正式環境／瀏覽器驗收依使用者安排留待上正式時執行。\n\n**09-24 下半**：考試判題改用發起者公司的 Anthropic key（commit `d4fe4fa1`，設計 `2026-09-24-exam-byok-design.md`）。使用者從四個目標裡只挑 BYOK，所以沒有搬進 `runClaude`、沒有記帳、沒有花費上限。全跑 402 suites／5907 tests，新增 24 項全過，**失敗數與動手前的基線完全相同**（4 項，都在 `frontend-base-path` 與 `frontend-auth-reactivity` 這兩支既有紅燈上）。**未重啟、未人工驗收。**\n\n**那兩支既有紅燈已查清並修好（commit `bda54b8e`）——⚠ 先前在本檔寫成「真的壞掉」是誤判，更正如下**：兩支都是**守衛過期，程式沒有壞**。\n\n`frontend-auth-reactivity`：`api.js` 的 `setToken` 寫 `authState.loggedIn = !!readToken()`，守衛卻要看到字面的 `= true`。行為完全正確（而且 `!!readToken()` 更嚴謹，`setToken('')` 不該算成已登入）。**沒有「登入後版面不會切換」這個 bug。**\n\n`frontend-base-path`（3 項）：`setup.html` 的 inline script 在 09-23 的資安收斂 `9a8f7c3f` 裡抽成 `js/setup.js`，守衛還在 `setup.html` 裡找 `BASE_PATH`。**初始設定頁是好的。**\n\n修法是改守衛不是改程式：`api.js` 那支改成真的把檔案跑起來問結果（文字比對守得住寫法、守不住意圖），`setup.html` 那三條改讀新位置並補一條「`setup.js` 頂層第一行就用到 `BASE_PATH`」讓載入順序仍是 load-bearing。兩支都用變異測試反向驗過。\n\n**因此全跑現在是 403 suites／5922 tests、0 失敗、exit code 0**——這是這條線第一次真的全綠。以後出現的紅燈一律先當成自己造成的（`.claude/rules/always.md` 第 2 條）。\n\n2026-09-23 另完成已知相依漏洞與憑證檔權限等平台資安收斂（`9a8f7c3f`）；這是產品化前的安全工作，**不把它灌進上述 80%**。本機 Windows 全套測試有既有紅燈；相關 147 項測試與兩處 npm 稽核通過，不等於整套人工驗收已完成。\n\n**階段 3 的「換認證」那半已完成並上線**（憑證欄位、解析函式、接進容器、公司填 key 的入口）。單張任務花費上限、實際金額記帳與公司管理員用量報表已完成程式實作，尚未上線驗證。剩下的是預設金額裁決，以及真 key 對帳與錯誤分類實測。\n\n**估法**：以今天早上的 70%／七項剩餘工作為基準。**七項裡三項完成**：階段 5 更版機制（9 關＋整枝審查＋兩個 Critical 修正，已上線並重啟）、管理員自我停權、`GET /api/admin/users` 缺 `company_id`。另外完成兩項**原本不在表上**的：AI 家目錄跨公司外洩（今天新發現）、舊版前端完全退役。新手教學依權限跳步驟也做完。\n\n**信心中低的理由與早上相同，而且範圍更大了**：今天所有前端改動——公司管理頁改版與搬家、側欄即時更新、更版相關三處介面、舊版退役後的 ui-next——**一次都沒有人用瀏覽器點過**。舊版退役後沒有退路可退，這一點讓人工驗收從「應該做」變成「必須做」。\n\n剩下的程式工作，按大小：\n\n| 剩下的 | 大小 | 說明 |\n|---|---|---|\n| **四種身分的人工驗收（含深色模式）** | 小，但**還沒有人做過** | 前端沒有自動化測試，這一步無法用程式取代。3b 專屬清單見 `docs/3b-manual-verification-checklist.md`，其中 2 項規格上就只能人工證明 |\n| 階段 3 客戶自帶 API key | 中（**換認證已上線、花費上限／報表待上線**） | ✅ 已做：`companies.anthropic_key_enc`、`buildClaudeAuthEnv(userId)`、接進容器路徑、公司填 key 的端點。🔨 已完成程式、待上線驗證：公司可設定單張任務上限、每次容器 AI 執行前重算餘額並傳 `--max-budget-usd`、`token_usage.cost_usd` 優先記 Claude 回報值、公司報表依用量當時的 `company_id` 強制限縮、非全容器模式遇到有上限任務即停止。⬜ 剩：預設金額裁決、真 key 對帳與錯誤分類實測。⚠ 沒有 `result` 的失敗輪仍可能漏記成本；舊非容器路徑仍可能用平台訂閱，未設定上限的客戶任務不可因此視為已安全上線 |\n| 階段 4 客戶按到底 | 小（**角色矩陣已完成**） | ✅ 已做：待上正式清單供專案成員唯讀，執行仍限有 `can_release` 的公司管理員／平台管理員；正式部署改用同一權限判準；確認視窗列任務提出者、公司、核准時間與不備份資料庫警告；客戶規格頁預設摘要＋驗收條件，原始 YAML 僅平台管理員可取；停下時客戶只看白話原因並可請平台協助；合併衝突改由平台管理員處理與接收通知；正式部署失敗會通知綁定公司的管理員及平台管理員（不把別家公司任務放進收件匣）；上正式合併 main 失敗由平台接手，客戶只看白話訊息；缺 Git 憑證顯示公司設定提示。✅ **完整角色矩陣已完成**（09-24，commit `158b0962`，`app/server/tests/project-release-role-matrix.test.js`）：六格全上 HTTP 層，其中四格此前完全沒測過——沒綁該專案的公司管理員必須 404 而非 403（403／404 的差別就是「id 存不存在」的洩漏管道）、有綁沒勾 → 403、**內部公司的公司管理員對客戶專案 → 403**（規格 §162）、平台管理員的正向路徑。已用變異測試雙向驗過（`canReleaseProject` 釘成永遠 true 有 7 項紅、永遠 false 有 5 項紅）。⬜ 剩：瀏覽器／正式環境人工驗收。 |\n| 考試判題的憑證 | 小（**BYOK 已完成程式**） | 09-24 使用者把目標收斂成「只要客戶自帶 key」，其餘刻意不做。✅ 已做：`exam_uploads.user_id`、通行碼記下發放者、`checkExamToken` 解出身分、判題／讀題／讀成績單三處都用 `buildClaudeAuthEnv` 解出的憑證、沒 key 即該頁失敗不退回廠商訂閱。設計見 `2026-09-24-exam-byok-design.md`。⬜ 剩：重啟＋兩項人工驗收（內部跑完一場、客戶沒 key 的失敗訊息到不到畫面）。**刻意不做**：記帳（考試花費仍不進 `token_usage`）、進容器、花費上限、公司停用時中止正在跑的那一輪 |\n\n| 舊版退役後失去畫面的四個功能 | 小 | 健檢提案的人工處置與裁決、**整個收件匣頁**（read-all 與 snooze 沒有 UI 了）、任務頁的單張健檢、任務清單的具名篩選組合。**後端端點全在**，只是沒有入口。使用者已知並接受 |\n\n**更版的維護時段已設定**（09-24 使用者設定，查正式 DB 確認：`release_window = {\"weekdays\":[0,6],\"startHour\":1,\"durationHours\":5}`＝每週六、日凌晨 01:00–06:00）。機制從此會啟動；`release_last_window` 與 `release_last_result` 仍是 null，代表**還沒有跑過任何一次**，第一次落在下一個週末。\n\n**仍要記住的一條**：容器家目錄分公司**只在容器模式生效**，沙箱模式關掉或改回 `projects` 就失效（正式目前是 `all`，實查確認）。09-24 使用者表示不會去關它。\n\n**開第一家客戶之前的阻擋條件（零碎但不可略）**：考試要**以一家客戶公司走完一次流程**人工驗收（09-24 裁決客戶可以用考試作戰台，租戶隔離程式已完成，見 `2026-09-24-exam-tenant-scope-design.md`）；共用專案的 Wiki 與待上正式清單仍可能跨公司可見，開通時須向相關公司說明。任務與對話本身已依建立者公司／本人隔離，不再列「尚未裁決任務隱藏」。\n\n**新手教學已依角色處置（09-22、09-23）**：「專案」課程只略過一般使用者看不到的管理員步驟，保留其餘可用步驟；「進度與通知」整課限管理員，步數在過濾後重算。09-23 使用者裁決「實際流程」課第 ⑤ 步**保留**「四關不用你出手」的教學：一般使用者改指看得到的動作區、不點管理員專用的執行歷程；管理員原步驟不變。已有定向回歸測試；人工瀏覽器驗收仍待做。\n\n### 合約要涵蓋的事（不算進度，但開客戶前必須完成）\n\n- 客戶自己按「上正式」造成的損害，責任歸屬\n- 上正式前**不備份**資料庫這件事要明寫（09-14 裁決）\n- AI 產出程式碼的責任範圍\n- AI 用量費用由客戶與 Anthropic **直接結算**\n- 資料保留與刪除\n- 以平台營運者身分同意 Anthropic 商用條款\n- 產品名稱、logo 不得含 Claude Code／Anthropic 字樣\n- 訂閱與收費方式\n\n\n> 這張表是唯一的進度來源。每完成一塊就在這裡改，細節看下面各階段。\n\n| 階段 | 內容 | 狀態 |\n|---|---|---|\n| 0.1 | 平台 DB 每日備份 | ✅ **完成**（09-15 上線；09-16 04:00 自動備份已確認產生） |\n| 0.2 | ~~暫停夜間自動合併~~ | ⛔ 取消（R1） |\n| 0.3 | 正式平台設 `PLATFORM_CONTAINER` | ✅ **完成**（09-14 生效） |\n| 0.4 | ~~建 staging~~ | ⛔ 取消（R3） |\n| 0.5 | 健檢提案改人工核准 | ✅ **完成**（09-15 上線；09
