在。）\n\n---\n\n## 1. 原則\n\n| 原則 | 怎麼做到 |\n|---|---|\n| **正式平台上不影響真使用者** | ~~另開 staging~~（R3 09-14 決定不開）⇒ 新東西藏在開關後面合進正式，只對測試公司／測試帳號打開驗證（§2.1） |\n| **合併進 master ≠ 啟用** | 每塊都藏在功能開關後面，預設關；合併後正式平台行為不變 |\n| **資料庫只加不改** | 走 `db.js` 的 ALTER 加欄位清單，新欄位允許 NULL、預設值不改變既有資料的意義 |\n| **重啟要排時間** | 改 `app/server` 一定要重啟才生效（rules/always.md 3），而重啟會影響測試區（§2.3）；合併攢成一批、挑沒人用的時段一次重啟 |\n| **每一步都退得回去** | 功能開關關掉＝回到舊行為；程式碼用 `git revert`；資料表只有新增，不需要反向遷移 |\n| **會改變現有使用者感受的事，拆出來另外排、先講** | 例如內部一般人失去工具（§4 階段 2b） |\n\n**重啟的方式**：使用者一律跑 `upgrade.sh`。Docker 模式下它做的是 `git pull --ff-only`＋`docker restart odoo-v2`，**不重建容器**（`upgrade.sh:66-67`）。\n⇒ 寫進 `docker-compose.yml` 的環境變數改了不會生效；真的要重建容器，會清掉容器內的 `~/.claude.json`，還得再跑 `setup.js`（`upgrade.sh:54-61`）。\n\n---\n\n## 2. 現況：開發時會撞到正式平台的地方\n\n### 2.1 不開 staging 之後，在正式平台上怎麼驗證（R3 09-14）\n\n| 做法 | 說明 |\n|---|---|\n| 功能開關可以**只對某家公司打開** | 開關除了全域開／關，還要能指定公司 id；測試時只開給「測試公司」 |\n| 固定一家**測試公司**＋兩個測試帳號（公司管理員、一般使用者） | 階段 2a 建好後一直留著，之後每塊都拿它驗 |\n| 測試公司只綁**測試專案** | 不綁任何真客戶專案；部署目標只用測試機，絕不指向真客戶正式機 |\n| 攻擊實測腳本在正式平台跑 | 腳本是自己寫的，沒關好的結果是「測試不過」，不是真的外洩；但跑之前確認是對測試專案 |\n| 重啟排時段 | 開發中重啟次數會變多，照 §2.3 先看在飛任務與測試區 |\n\n**代價**：測試資料跟真資料在同一個 DB；staging 能擋的「改壞了整個平台起不來」擋不住，只能靠合併前全跑測試＋重啟排在沒人用的時段。\n\n### 2.1-舊 另開 staging 平台的撞車點（R3 決定不開，保留供日後參考）\n\n| 撞車點 | 為什麼會撞 | 怎麼避開 |\n|---|---|---|\n| 測試區容器名 | `odoo-test-<資料夾名>`，**沒有實例前綴**（`docker-env.js:77-80`）；建環境第一步就砍同名容器 | staging 的專案資料夾名一律 `stg-` 開頭；不複製正式 DB |\n| 找「自己是哪個容器」 | 沒設 `PLATFORM_CONTAINER` 時比對主機名（`finding-fix.js:432-439`）；host 網路下兩個容器主機名相同 ⇒ 丟「無法唯一辨識平台容器」 | **R2 已決**：`start.sh` 從 `data/config.json` 讀 `PLATFORM_CONTAINER`；這台已設 `odoo-v2`，下次跑 `upgrade.sh` 生效。staging 在自己的 config.json 設自己的名字 |\n| 平台埠、內建 PG 埠 | 都是 host 網路；正式 `PORT`＝8771、`PGPORT_APP`＝8772（`docker/entrypoint.sh:11`） | staging 用另一組，開之前 `ss -ltn` 確認沒被佔 |\n| 測試區埠池 | 正式 21000–21099（`data/config.json`） | staging 用不重疊的區段，一樣先確認 |\n| nginx 設定 | 設了 `NGINX_*` 就會寫共用 nginx 的 conf（曾因此清空真設定，記憶 tests-wipe-real-nginx-conf） | staging **不設**任何 `NGINX_*`、`ENV_EXTERNAL_URL_TEMPLATE` |\n| 客戶憑證 | 正式 DB 裡有客戶正式機 SSH、DB 連線、自動部署目標 | staging **用全新 DB**，不放任何真客戶連線 |\n| 排程 | 夜間健檢、夜間改善、同步、測試區夜間關機都在 cron | staging 的排程全部關掉，要測哪個手動觸發 |\n| Claude 用量 | staging 的 AI 若用同一組訂閱 token，會吃掉正式 pipeline 的額度（用量閘門是全域的，rules/infra 134） | staging 測試量控制小，重的測試排在下班時段 |\n| compose | `docker-compose.yml` 寫死 `container_name: odoo-v2` | staging 另一份 compose 檔、另一個 project name、另一組 volume |\n\n### 2.2 夜間改善會在開發期間自己改 master＋重啟（R1 已決：不暫停）\n\n- `teams_settings.cli_push_user_id` 已設 ⇒ 夜間改善**自動合併進 master 並 `docker restart`**（`finding-fix.js:583-596`）。\n- 夜間健檢 **22:00** 開始（`cron.js:121`），跑完才接著改善、合併、重啟。\n- **使用者裁決 09-11：不暫停**（「我基本上都會是早上做」）。代價與對應：\n\n| 會發生的事 | 對應 |\n|---|---|\n| master 半夜被改，開發分支隔天可能衝突（第 0 塊要改的 `claude-runner.js` 這類檔，正是健檢常修的地方） | 每天早上開工第一件事：把 master 併進開發分支、重量測試基線（§3 第 2 步） |\n| 夜間合併遇到主 clone 有別人的暫存變更會拒絕合併 | 開發一律在獨立 worktree，主 clone 不留東西 |\n| staging 一開，夜間重啟會認不出自己 | R2 已生效（09-14）；R3 決定不開 staging，這條目前不會發生 |\n\n### 2.3 正式平台每次重啟的代價\n\n- 在飛的 AI 被砍，任務卡在執行中（`runner.js:574`）。\n- 測試區資料庫住在平台容器裡；重啟後測試區 bus 約 50 秒自癒，但 **Odoo cron 執行緒永久死掉，要重開那個測試區**（記憶 testenv-disconnect-from-platform-restart）。\n- 重啟前先看：`/api/pipeline/inflight` 有沒有任務在跑、有幾個測試區在跑（09-11 實查只有 1 個）。\n\n### 2.4 這台主機不是只有平台\n\n20 核、187 GB 記憶體（可用約 140 GB）、磁碟剩 596 GB；**同時跑著約 110 個容器，其中很多是其他服務**。AI 容器與 staging 都要設資源上限，避免擠到別人。\n\n---\n\n## 3. 開發方式（每一塊都一樣）\n\n1. 開自己的 git worktree 與分支，不共用 checkout（rules/always.md 5）\n2. **每天早上**先把 master 併進開發分支（夜間改善可能改過），再全跑一次測試記下基線：`cd app && npm run test:quiet`（rules/always.md 1、2）\n3. 合併進 master（開關關）→ 重啟 → 只對測試公司打開，在正式平台跑通（§2.1）\n4. commit 只挑自己的檔（rules/always.md 4；平行 session 時用私有 `GIT_INDEX_FILE`，記憶 shared-index-race-on-commit）\n5. 合併進 master，功能開關保持關\n6. 攢一批，挑時段跑 `upgrade.sh` 重啟正式平台 → 重開正在跑的測試區\n7. 在正式平台打開開關，先開小範圍，觀察後再全開\n\n---\n\n## 4. 階段\n\n### 階段 0：準備（不改平台程式碼）\n\n| # | 事項 | 狀態／影響正式平台？ |\n|---|---|---|\n| 0.1 | **平台 DB 每日備份**（子專案 4 §4.4）：~~主機排程 `docker exec odoo-v2`~~ **09-15 使用者選平台 cron**（容器內沒有 crontab、碰不到主機排程）每日 04:00 跑 `pg_dump`（埠 8772），`APP_SECRET` 另外保存；還原演練 09-15 已做一次、通過。✅ **已完成**：09-15 17:53 重啟生效；**09-16 04:00 的每日自動備份已確認產生**（`data/backups/platform-db-20260916.dump`，10.6 MB） | **R5 已決（09-14）**：先放這台、留 14 天，之後再搬到別處。不影響，備份時的讀取負載排在半夜 |\n| 0.2 | ~~暫停夜間改善自動合併＋重啟~~ | **取消**（R1 決定不暫停），改為 §3 第 2 步每天早上同步 master |\n| 0.3 | 正式平台設 `PLATFORM_CONTAINER=odoo-v2` | **已生效**：09-14 09:14 平台重啟後，node 環境已帶 `PLATFORM_CONTAINER` |\n| 0.4 | ~~建 staging~~ | **取消**（R3 09-14 不開 staging） |\n| 0.5 | **健檢提案改人工核准**（R6 09-15）：提案一律存 `pending`，平台管理員核准才進夜間改善；核准頁顯示送給 AI 的完整文字。自動合併維持不變 | **會改變現有行為**：夜間改善不再自己挑健檢提案，你沒核准的就不會修。改 `app/server` 要重啟。不依賴其他塊，可以現在做。**09-15 已實作**（分支 `feat/platform-db-backup`，與 0.1 同分支）：提案一律 `pending`、在範圍內的開意見回饋單狀態 `new`；健檢頁與意見回饋管理的「核准」雙向同步（原本不同步：健檢頁核准的提案若已開單，夜間批次永遠撈不到）。核准頁本來就顯示全文、有核准鈕，前端不用改。✅ **已完成**：09-15 17:53 重啟生效；09-16 實測夜間健檢 run 45 產出的 2 條提案都停在 `pending`（前一輪 run 44 還是自動 `done`），行為確實改變了 |\n\n\n### 階段 1：子專案 0「把 AI 關起來」\n\n最大、風險最高的一塊，所以最先做。\n\n🔨 **進行中（09-16 起）**：worktree `feat/agent-sandbox`；前置量測 M1／M2／M3(1-2) 已完成且結論全部符合計畫預期（細部見 §0 的表）。下一步是第 1 部 Task 1.1 `agent-profiles.js`。\n\n| 步驟 | 影響正式平台？ |\n|---|---|\n| 1.1 映像檔、出口閘道、internal 網路、unix socket、每次執行通行證（名稱與 label 仍帶實例 id，日後開第二套平台才不會撞） | 合併時開關關，不影響 |\n| 1.2 攻擊實測腳本在正式平台、對測試專案全過 | 只動測試專案 |\n| 1.3 合併進 master，開關 `agent_sandbox` 關 | 重啟後行為不變 |\n| 1.4 正式平台：開關只開給**內部 AI**（健檢、改善） | 只影響夜間批次 |\n| 1.5 試跑比對：挑幾種任務，比 token 用量與結果（因為容器裡沒有你的個人外掛與 RTK，規格 0 §7） | 觀察期 |\n| 1.6 開給全部 AI | pipeline 全部改走容器；有差異在 1.5 就會看到 |\n| 1.7 移除舊的無容器路徑 | — |\n\n### 階段 2：子專案 1「租戶隔離」\n\n原本拆 2a／2b 兩段，**R4 決定一起上**（09-14）；上線前先告知內部 6 個一般使用者。\n\n| 步驟 | 內容 | 影響正式平台？ |\n|---|---|---|\n| 2a | `companies` 表（含內部公司一筆）、`users.company_id`、`project_companies` 多對多（17 個專案全綁內部公司）、`company_admin` 角色、`req.actor`、各路由的公司範圍檢查、靜態守衛測試、GIT「個人→公司」退回、建測試公司 | **現有人員看不出差別**：admin 無公司看全部；6 個 user 屬內部公司、內部公司綁全部專案，看到的跟現在一樣；GIT 退回只在「沒個人 PAT」時才發生。⚠ 遷移漏綁任何一個專案，內部人員就會看不到它——遷移後比對「專案總數＝內部公司綁定數」 |\n| 2b | 內部公司成員（現在 6 個 user）的工具改成平台管理員限定（規格 1 §2）——**與 2a 同一批上** | **會影響現在那 6 個人**：上線前先告知 |\n| 2c | **測試區獨立 DB 帳號**（規格 1 §10，09-14 新發現）：每個測試區非超級使用者的 PG 角色、`REVOKE CONNECT`、既有測試區遷移 | 要重建每個在跑的測試區容器；不依賴公司表，**可以比 2a 更早做**，任何客戶進測試區前必須完成。<br>✅ **已完成**：09-15 實作（`8ca9913d`）、09-16 正式平台驗證全過。⚠ 途中撞到一個**上線才會出現**的缺口：撤銷 PUBLIC 連線時把 `postgres` **維護庫**也一起撤了，而 Odoo 非連它不可（映像 entrypoint 的 `wait-for-psql.py`、bus 的 imbus `LISTEN`、`ir_cron` 喚醒 worker），導致**所有測試區完全建不起來且 log 一片空白**；已補「只對該測試區角色 `GRANT CONNECT ON DATABASE postgres`」修掉（`56b1cdd9`）。驗證結果：容器帳號 `testenv_p18`、DB 擁有者已轉、殘留物件 0、`/web/login` 回 200、`ir_cron` 正常；`aidev` 與別家 `test_*` 全擋、`COPY TO PROGRAM` 擋、`pg_authid` 擋、`rolsuper=f`。**尚未由真人點過 SSO 登入** |\n\n驗證：自動測試跑規格 1 §9 的跨公司矩陣（pg-mem）；正式平台上用測試公司登入，確認只看得到測試專案。\n\n### 階段 3：子專案 2「客戶自帶 API key」\n\n- 只作用在「發起的人屬於一般公司」的執行。正式平台現在只有內部公司與測試公司 ⇒ **合併、重啟後完全不影響現有流程**。\n- 用你自己開的一把測試 key 填進測試公司，跑完一張任務，對帳 Anthropic Console（規格 2 §7）。這會花一點點真錢。\n\n### 階段 4：子專案 3「客戶按到底」\n\n- 客戶的關卡畫面只對公司帳號出現 ⇒ 內部流程不變。\n- 上正式的權限改動（內部公司成員不能合併 main）跟 2b 一起排。\n- 用測試公司的公司管理員，對一個**測試用的部署目標**（不是真客戶機）走完上正式。\n\n### 階段 5：子專案 4「上線營運」\n\n更版機制的計畫見 `docs/superpowers/plans/2026-09-22-stage5-release-mechanism.md`；**更版機制程式已於 09-22 上線**，不是「尚未動工」。健檢提案人工核准更早於 09-15 上線；維護時段設定與人工驗收仍待完成。下表保留子專案 4 其餘待辦範圍，不代表更版機制尚未實作。\n\n| 事項 | 影響正式平台？ |\n|---|---|\n| 平台更版機制（夜間改善通過審核後自動合併、維護時段測試與重啟、重啟後自動重開測試區） | 合併與重啟分離；**R6 已決保留自動合併**，不要再寫成待更版清單人工合併。程式已上線，維護時段設定與人工驗收待辦 |\n| 公司開通頁、訂閱到期通知、客戶離開流程 | ✅ 到期通知排程、14／3 天去重與派送，以及兩種管理頁的持續到期警示，已完成程式及自動化測試；不做個人收件匣（09-24 選方案 1）。✅ **客戶離開：09-24 裁決第一版只停用、不刪除**，而停用那條路已經完整（工作台 API 403、AI 不給跑、不用他們的 GIT 憑證、只中止那家公司正在跑的任務），**所以這一項不需要新程式**；拿掉刪除的三個實查理由見 `2026-09-11-saas-operations-design.md` §4.7。⬜ 開通頁與正式環境驗收仍待辦。新增通知不改現有訂閱擋關行為 |\n| 容量實測、監控告警 | 不影響 |\n| 條款、價格、金流 | 非程式 |\n\n### 階段 6：第一家客戶\n\n**開始前的硬條件（缺一項就不准開第一家客戶，09-15）**：\n\n| 條件 | 為什麼 |\n|---|---|\n| 階段 1.7 完成：只剩容器路徑 | 0 §9：客戶登入前開關必須移除 |\n| 階段 2c 完成：測試區獨立 DB 帳號 | 總覽 §6.2 I3 |\n| 階段 0.5 完成：健檢提案改人工核准（R6） | 總覽 §6.2 I1：客戶文字能經夜間改善變成平台碼 |\n| 階段 1 的內部 AI 權限分級完成：只有健檢 AI 能查平台 DB，platform-fix 等改碼／審碼的 AI 查不到（R6-A） | 同上：讓改碼的 AI 只讀得到人核准過的文字 |\n\n1. 在正式平台建一家「內部測試公司」，你自己扮客戶走一次完整流程\n2. 找一家關係好的客戶試用，範圍限一個專案\n3. 沒問題再開放\n\n---\n\n## 5. 需要你同意才能動的事\n\n| # | 事項 | 狀態 |\n|---|---|---|\n| R1 | 開發期間暫停夜間改善自動合併＋重啟 | **已決 09-11：不暫停**（條件見 §2.2） |\n| R2 | 正式平台設 `PLATFORM_CONTAINER` | **已決 09-11：由 `start.sh` 從 `data/config.json` 讀**；程式已改、這台已設，下次 `upgrade.sh` 生效 |\n| R3 | 另開 staging 容器（多吃這台主機的資源，且主機上還有別人的服務） | **已決（09-14）：不開 staging**，改用「功能開關預設關＋正式平台上的測試帳號／測試公司」驗證。代價：開發中正式平台重啟次數變多（§2.3）、測試資料與真資料同庫。§2.1、§4 階段 0.4、§3 第 3 步需改寫 |\n| R4 | 階段 2b 的日期（6 個內部公司成員失去工具） | **已決（09-14）：跟 2a 一起上**，不分兩次。上線前先告知那 6 個人 |\n| R6 | 夜間改善自動合併要不要**現在**就停（09-15 新增）：這個注入洞現在就存在（總覽 §6.3）。止血法＝清空 `cli_push_user_id`，不改程式；代價是前端修正審核時看不到截圖（不會卡住，總覽 §6.3），合併改到管理頁手動按 | **已決（09-15）：不清空設定、維持自動合併**，改成**健檢提案一律人工核准**（階段 0.5）＋A 改碼的 AI 查不到平台 DB（階段 1）＋B 合併後留紀錄可回查。已知剩下的風險：核准時沒看出全文裡藏的指令 |\n| R5 | 平台 DB 備份檔放哪、留幾天（規格 4 O7） | **已決（09-14）**：先放這台、留 14 天，之後再搬（這台整台壞掉仍救不回，搬走前是已知風險）；`APP_SECRET` 與備份分開放 |\n\n---\n\n## 6. 可以同時進行的\n\n```\n階段 0.1 備份 ────────────────► （R5 已決，隨時可做，越早越好）\n階段 0.3（已完成，09-14 生效）\n階段 0.5 健檢提案人工核准 ──► （R6 已決，隨時可做）\n階段 1 ─► 階段 2a ─► 階段 3 ─► 階段 4\n                                  └► 2b 與 2a 同批上\n階段 2c 測試區 DB 帳號 ──────► （不依賴其他塊，客戶進測試區前必完成）\n                          階段 5 的更版機制 ─► 可在階段 1 完成後就開始\n```\n"},{"id":"sandbox","num":"0","label":"把 AI 關起來","deps":"無前置","file":"2026-09-11-agent-sandbox-design.md","md":"# AI 執行隔離設計（平台產品化 子專案 0）\n\n日期：2026-09-11\n狀態：設計已裁決且主要容器路徑已上線；舊無容器路徑尚未移除，實際進度以「開發順序」§0 為準\n所屬：平台產品化（SaaS 多租戶）拆法 v2 的第 0 塊。後續：1 租戶隔離／2 客戶自帶 API key／3 客戶按到底／4 上線營運\n\n---\n\n## 1. 目標與非目標\n\n### 目標\n\n任何一次 AI 執行就算被提示詞注入（客戶需求、附件、退回原因裡藏指令），也**拿不到**：\n\n- 平台總鑰匙：`APP_SECRET`、`JWT_SECRET`、`DATABASE_URL`\n- 其他專案的程式碼與資料\n- 客戶正式機、DB、SSH、VPN 憑證\n- 平台自己的資料庫（內部 AI 只給唯讀、且遮蔽敏感欄位）\n\n**能連的地方只有三個**：Anthropic、Context7、平台的 `/ai` 查詢入口。\n\n客戶觸發的 AI 與內部 AI（健檢、夜間改善）都納入，權限分兩級。\n\n不影響使用者感受的回應時間：實測每次多 0.23–0.26 秒，對問答中位數 40.6 秒約 0.6%（§2.12）。\n\n### 非目標\n\n- **不做**公司、角色、租戶資料隔離（子專案 1）。本期的隔離單位是「專案」。\n- **不做**客戶自帶 API key（子專案 2）。本期容器內仍用平台現有的 Claude 認證，只是改走白名單注入。\n- **不改**git 合併、部署、SSH 這些平台本體動作——它們本來就在平台 node 裡跑，不經過 AI。\n- **不做**平台更版機制（子專案 4）。夜間改善自動合併進 master 的問題留給它。\n- **不做**公司啟用開關／訂閱期間的判斷，只留檢查點 `canRun(scope)`（§4.4）。\n- **不把 Codex 容器化**：客戶只用 Claude，Codex 只留內部（使用者裁決 2026-09-11）。本期只對 Codex 路徑做環境變數白名單（§4.6）。\n\n---\n\n## 2. 現況事實（2026-09-11 實查）\n\n### 2.1 AI 怎麼跑\n\n`app/server/pipeline/claude-runner.js:159` 以 `--dangerously-skip-permissions` spawn `claude`，cwd＝任務 worktree。\n無沙箱、無容器，與平台同一個系統使用者（uid 1004）。\n\n### 2.2 總鑰匙直接在 AI 的環境變數裡\n\n- `start.sh:30-41` 把 `JWT_SECRET`、`APP_SECRET`、`DATABASE_URL`（有設時連 `ANTHROPIC_API_KEY`）export 進 node。\n- `claude-runner.js:197` 以 `{ ...process.env, … }` 整包傳給 AI。\n\n⇒ **任何一次 AI 執行 `echo $APP_SECRET` 即得總鑰匙。** 另外 `data/config.json`（權限 664）同 uid 可讀。\n\n### 2.3 `/ai` 通行碼全平台一組\n\n- `lib/ai-token.js` 的 `aiToken()` 是固定標籤的 HMAC，沒有參數。\n- `/ai/db/query` 的專案 id 是從連線反查的，不綁呼叫者。\n- 閘門＝來源必須是 loopback（`ai-token.js:70`）＋通行碼。\n\n### 2.4 網路\n\n- 平台容器 `NetworkMode=host`。8771 監聽 `*`；8772 監聽 `127.0.0.1` 與 `10.0.0.1`。\n- 從一般 bridge 容器（`--add-host host.docker.internal:host-gateway`）實測**連得到** 8771、22、8772、21000；5416 refused。\n\n⇒ 光把 AI 放進容器不夠，網路必須另外封。\n\n### 2.5 可用的隔離手段\n\n| 手段 | 結果 |\n|---|---|\n| 不同系統使用者 | 不行：容器內 `sudo: command not found` |\n| Claude Code 內建沙箱（bwrap） | 不行：`bwrap: No permissions to create a new namespace`（09-08 chat 102/103）；Codex 同因（`sandbox-signature.js:4-8`） |\n| tmux | 不是隔離：同 uid、同檔案、同網路 |\n| **docker sibling 容器** | **可行**：`docker` 29.7.2 可用；`docker-env.js`、`odoo-core-src.js`、`vpn-gateway.js` 已在開 |\n\n### 2.6 路徑（掛載用）\n\n- 容器內外同路徑（同構）：`/home/odoo/odoo-v2`、`/home/odoo/odoo-envs`\n- **不同構**：`/home/odoo/.claude` 是 volume `odoo-v2_claude-home` ⇒ 新的 AI 家目錄不能放這裡\n- repo：`repos/<folder>/<label>`；worktree：`<專案根>/.worktrees/<task_id>/<subdir>`（`task-agent.js:75`）\n- Odoo 原始碼：`data/odoo-core/{14,17,18,19}`；企業版：`enterprise/{17,19}`\n\n### 2.7 AI 合法需要的東西\n\n| 需求 | 來源 |\n|---|---|\n| 任務程式碼（讀寫） | worktree |\n| commit | 主 clone 的 `.git`（worktree 的 objects／refs 寫在這） |\n| 查 Odoo 原始碼（唯讀） | `data/odoo-core`、`enterprise` |\n| skill 文件（唯讀） | `.agents/skills/*`（prompt 以路徑引用 healthCheck／platformDev／odooDev） |\n| 查客戶 DB／log／wiki | getSQL、getLog、wikiQuery 三個 skill 走 `curl $AIDEV_AI_BASE/ai/...` |\n| 呼叫模型 | `api.anthropic.com`；OAuth token 更新走 `platform.claude.com` |\n| 查文件 | Context7：`context7.com`、`mcp.context7.com`（context7-mcp 以 undici `ProxyAgent` 支援 `HTTPS_PROXY`，`dist/lib/api.js:37-64`） |\n| 接續對話 | `--resume` 的 session 檔 |\n\n**兩個例外直接連平台 DB 的 skill**：`platformDB`（`DATABASE_URL`＋`query.js`，health-auditor 用）、`odooGlossary`（`query.js` 查術語表）。\n\n### 2.8 claude 安裝\n\nnpm 全域 `@anthropic-ai/claude-code` **2.1.266**。程式本體含 `CLAUDE_CONFIG_DIR`、`DISABLE_AUTOUPDATER`、`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC`、`HTTPS_PROXY` 字串。\n官方文件確認支援 `HTTPS_PROXY`／`https_proxy`，不支援 SOCKS。\n\n### 2.9 使用者層設定現在會套到每個 pipeline AI\n\nHOME＝`/home/odoo` ⇒ 每次 `claude -p` 都載入：\n\n- 啟用中外掛：superpowers、hookify、code-review、context7、security-guidance\n- `~/.claude/CLAUDE.md`（graphify、RTK）\n- PreToolUse hook：`rtk hook claude`\n\nrunner 帶 `SECURITY_GUIDANCE_DISABLE=1` 就是這些外掛確實在作用的證據。進容器後這些都不會有（§7）。\n\n### 2.10 內部 AI 的二階注入\n\n- 意見回饋 `POST /api/feedback` 只驗登入；要 admin 經 `PATCH /api/admin/feedback/:id` 核准才進夜間改善。\n- **健檢提案**經 `nightly-fix.js:144`（`inAutoFixScope`）**自動入選，無人工閘**。\n- `teams_settings.cli_push_user_id` 已設 ⇒ `adoptFix → applyFix` **自動合併進平台 master**。\n- 健檢會讀任務資料，未來大部分是客戶文字。\n\n### 2.11 停止、逾時、重啟、接續\n\n- 停止／逾時：`killChildGracefully` 送 SIGTERM，5 秒後 SIGKILL（`lib/proc.js:71-73`）\n- 重啟：`runner.js:574` 註解明寫重啟會砍掉在飛的 agent\n- 接續：整條 pipeline **沒有**「`--resume` 找不到 session」的退路（grep 0 筆）\n\n### 2.12 效能\n\n| 量測 | 結果 |\n|---|---|\n| `docker run --rm node:22-slim`＋bridge 網路＋bind mount（5 次） | 226–259 ms |\n| 同上，不接網路 | 125–164 ms |\n| chat 回覆（近 30 天 322 次） | p50 40.6 s／p90 141.8 s |\n| cs 回覆（170 次） | p50 76.0 s |\n\n### 2.13 AI 呼叫點\n\n程式碼中字面出現的 agentType 共 22 種：\n`analysis`、`coding`、`qa`、`respec`、`merge`、`merge-explain`、`merge-clarify`、`wiki`、`spec_tour`、`reject_triage`、`reject_classify`、`deploy_fix`、`cs`、`chat-to-task`、`chat-title`、`repair`、`wiki_drift_classify`、`workflow_health`、`platform_fix`、`fix_verify`、`fix_review`、`feedback_merge`。\n\n⚠ `token_usage` 裡有 `chat`，但不在上面的字面清單（是用變數帶的）⇒ **字面 grep 不完整**，實作計畫要另從 `token_usage.agent_type` 與 `runAgent` 呼叫端補齊。\n\n---\n\n## 3. 設計總覽\n\n```\n平台 node（host 網路，持有全部憑證；git 合併／部署／SSH 都在這裡做）\n   │\n   │ docker run -i --rm（每次 AI 執行開一個）\n   ▼\nAI 容器 ──── 網路 aidev-agent-net（--internal，本身出不去）\n   │  HTTPS_PROXY 與 AIDEV_AI_BASE 都指向閘道\n   ▼\n出口閘道 aidev-gw（同時接 aidev-agent-net 與預設 bridge，不持有任何憑證）\n   ├─ CONNECT 白名單 → api.anthropic.com / platform.claude.com / context7.com / mcp.context7.com\n   └─ /ai/* 轉發 → unix socket data/run/ai.sock → 平台 node（平台代查，再回傳結果）\n```\n\n**為什麼 `/ai` 走 unix socket**：平台是 host 網路。閘道在 bridge 上，連回 8771 時來源 IP 是 bridge gateway（172.x），而 nginx 反代進來的請求也長這樣——**用 IP 分不出是閘道還是外面**。改走只有閘道容器掛得到的 socket 檔，這個問題就不存在。\n\n---\n\n## 4. 元件\n\n### 4.1 AI 映像檔 `aidev-agent:<claude 版本>`\n\n- 基底 `node:22-slim`（本機已有）\n- 裝 `git`、`ripgrep`、`curl`、`ca-certificates`\n- `npm i -g @anthropic-ai/claude-code@2.1.266`——**與平台同版**，升版兩邊一起升\n- **不裝** rtk，**不含**任何使用者層外掛\n- 以 `--user 1004:1004` 執行（與宿主檔案 owner 相同，避免 git dubious ownership 與寫入權限問題）\n\n### 4.2 每次執行的容器參數\n\n寫成純函式 `buildAgentRunArgs(run)`，放 `app/server/lib/agent-sandbox.js`。\n\n**scope**：客戶觸發的 agent＝`project-<id>`；內部 agent＝`internal`。\n\n#### 掛載（全部同構路徑）\n\n路徑一律由既有變數推導（`APP_DIR`、`ODOO_ENV_BASE`、`CORE_SRC_ROOT`、`enterprise_sources.local_path`、`project_repos.local_path`），**不寫死** `/home/odoo/...`（CLAUDE.md §0）。本文件出現的絕對路徑只是 2026-09-11 這台機器的實查值。\n\n| 來源 | 模式 | 給誰 |\n|---|---|---|\n| 本任務 worktree 父目錄 `<root>/.worktrees/<task_id>` | rw | project scope（有 worktree 的 agent） |\n| 各 repo 主 clone 的 `.git` | rw | 同上 |\n| ↳ 其中 `.git/config`、`.git/hooks` | **ro 覆蓋** | 同上（見下方⚠） |\n| 該專案主 clone | ro | project scope（沒有 worktree 的 agent，如 chat／cs） |\n| `data/odoo-core/<該專案版本>`、`enterprise/<該專案版本>` | ro | project scope |\n| `.agents/skills` | ro | 全部 |\n| `app/server/pipeline/hooks/scan-guard.*`、`app/server/pipeline/mcp/<profile>.json` | ro | 全部 |\n| `data/agent-home/<scope>` → 容器內 `HOME` | rw | 全部（session 檔、claude 設定） |\n\n⚠ **`.git/config` 與 `.git/hooks` 必須唯讀**：可寫的話，AI 能在 config 設 `core.fsmonitor`、filter driver，或在 hooks 放腳本；之後**平台在主機上**對同一個 repo 跑 git（merge、checkout）時就會執行它們——等於從容器逃到主機。\n另外，平台 node 自己跑 git 時一律帶 `-c core.hooksPath=/dev/null`，雙保險。\n\n#### 環境變數（白名單，其餘一律不給）\n\n| 變數 | 值 |\n|---|---|\n| `HOME` | 容器內家目錄（掛 `data/agent-home/<scope>`） |\n| Claude 認證 | 本期為 `getClaudeAuthEnv()` 的回傳；子專案 2 換成**發起者所屬公司**的 API key（09-14：專案可掛多家公司，不能用專案決定） |\n| `AIDEV_AI_BASE` | `http://aidev-gw:8080` |\n| `AIDEV_AI_TOKEN` | 本次執行的通行證（§4.4） |\n| `HTTPS_PROXY`、`https_proxy` | `http://aidev-gw:3128` |\n| `NO_PROXY` | `aidev-gw` |\n| `CLAUDE_CODE_PROMPT_CACHE_TTL` | `5m`（沿用現值） |\n| `SECURITY_GUIDANCE_DISABLE` | `1`（沿用現值） |\n| `DISABLE_AUTOUPDATER` | `1` |\n| `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` | `1` |\n| 呼叫端自帶的 `env`（如 E2E 密碼） | **必須先列入白名單**；沒列入的 key 直接丟例外，不默默丟掉 |\n\n**絕不放**：`APP_SECRET`、`JWT_SECRET`、`DATABASE_URL`，以及 `process.env` 的任何其他內容。\n\n#### 其他參數\n\n- `--rm`、`-i`（prompt 走 stdin，沿用現行）\n- `--network <實例 id>-agent-net`\n- `--name <實例 id>-run-<runId>`、`--label aidev.run=1`、`--label aidev.instance=<實例 id>`、`--label aidev.scope=<scope>`\n- **實例 id**：取自 `PLATFORM_CONTAINER`（正式＝`odoo-v2`）。內部網路、出口閘道、AI 容器的名字與 label 全部帶它——同一台主機上若另開 staging 平台，兩套才不會互相砍到對方的容器（開發順序見 `2026-09-11-productize-rollout-plan.md` §2.1）。下文的 `aidev-agent-net`、`aidev-gw`、`aidev-run-<runId>` 皆為正式實例的簡寫。\n- `--cap-drop ALL`、`--security-opt no-new-privileges`\n- `--read-only`＋`--tmpfs /tmp`\n- `--memory`、`--cpus`、`--pids-limit`：**三個一定要設**。數值在試跑時量 coding agent 峰值後訂（§10）；在訂出來之前，建構函式缺值就丟例外，不給「不設上限」的預設\n\n### 4.3 出口閘道 `aidev-gw`\n\n- 常駐容器。沿用平台映像 `odoo-v2:latest` 的 node，唯讀掛入閘道程式 `app/server/agent-gateway/`，不引入新映像。\n- 接兩個網路：`aidev-agent-net`（internal）與預設 bridge。\n- **本身不持有任何憑證。**\n\n| 埠 | 功能 | 規則 |\n|---|---|---|\n| 3128 | HTTPS CONNECT proxy | 只放行 `api.anthropic.com:443`、`platform.claude.com:443`、`context7.com:443`、`mcp.context7.com:443`；其他拒絕並記 log（目的地、來源容器） |\n| 8080 | `/ai` 轉發 | 只轉 `/ai/` 開頭的路徑到掛入的 `data/run/ai.sock`；其他回 404 |\n\n平台啟動時確認閘道與網路存在，不存在就建。\n\n### 4.4 平台端 `/ai` 改動\n\n- node 另開一個 unix socket listener `data/run/ai.sock`（權限 600、owner 1004），**只掛 `/ai/*` 路由**。只有閘道容器掛得到這個檔。\n- 從 socket 進來的請求**只認「每次執行通行證」**，不認舊的全域通行碼。\n- **通行證**：`HMAC(派生金鑰, runId|scope|projectId|exp)`。派生金鑰比照 `lib/ai-token.js` 的做法，由 `APP_SECRET` 加一個新的固定標籤（例：`aidev:agent-run:v1`）做 HMAC 得出——不直接拿 `APP_SECRET` 簽，通行證外洩也賠不到它。平台在記憶體保存「執行中清單」（runId → scope），**執行結束立刻作廢**，不只看到期時間。\n- **範圍檢查**\n  - `project-<id>`：`/ai/db/connections`、`/ai/db/query`、`/ai/db/log`、`/ai/wiki/*`、`/ai/tasks/*` 一律限定該專案。拿別專案的 `connection_id` → 403。\n  - `internal`：`/ai/wiki/*`、`/ai/tasks/*`、`/ai/platform/query`、`/ai/glossary` 可看全平台；**`/ai/db/*`（客戶正式 DB 與 log）一律 403**。使用者的裁決是健檢要「看得到全部任務」，沒有包含查客戶正式資料。\n- **舊路徑保留**（loopback TCP＋全域通行碼），只給互動式 session 用（例如你在終端機跑 `/getSQL`）。容器本來就連不到 loopback。\n- **新增兩個唯讀端點**，取代直連平台 DB 的兩個 skill：\n  - `/ai/glossary`：術語查詢，給 `odooGlossary`（術語表是公開的 Odoo 字串，不含客戶資料）\n  - `/ai/platform/query`：**只給 internal scope**，只准 SELECT，用唯讀 DB 角色；`*_enc`、`password_hash` 等敏感欄位不可讀。給 `platformDB`。\n- **檢查點**：發通行證前呼叫 `canRun(scope, actorUserId)`（09-14 加上發起者：公司與 key 看人不看專案）。本期永遠回 true；子專案 1 接上「發起者所屬公司啟用中且在使用期間內」；子專案 2 接上「公司已設定 API key」與「未超過單張任務花費上限」。\n\n### 4.5 內部 AI（健檢、夜間改善）\n\n同一套容器，scope＝`internal`，權限比客戶大（使用者裁決 2026-09-11）：\n\n| agent | 掛載 |\n|---|---|\n| `platform_fix`、`fix_verify` | 平台 repo 的修正 worktree（rw；`.git/config`、`.git/hooks` 同樣 ro） |\n| `workflow_health`、`fix_review`、`feedback_merge` | 平台 repo 的**乾淨 worktree**（ro） |\n\n⚠ **絕不掛正在運作的 `/home/odoo/odoo-v2` 本體**：裡面有 `data/config.json`（三把總鑰匙）與 `data/run/ai.sock`。一律從 git 開 worktree——`data/` 在 `.gitignore` 內，worktree 裡天生沒有它。\n\n- 查平台 DB 走 `/ai/platform/query`（唯讀、遮蔽敏感欄位）——**只給 `workflow_health`**（09-15 R6-A）。`platform_fix`、`fix_verify`、`fix_review`、`feedback_merge` 的通行證**不含**這個端點：它們只該讀到平台管理員核准過、放進 prompt 的那段文字；能自己查 DB，就能在核准之後讀到新的客戶文字而被注入，而它們的產出會自動合併（總覽 §6.3）。09-15 查 `.claude/agents/*.md`，引用 platformDB 的只有 `health-auditor`（`coding-project` 那筆是「不要讀」），分級不會弄壞現有 prompt。實作上 internal scope 要拆兩級（例：`internal-audit`／`internal-fix`）\n- 一樣拿不到三把總鑰匙、客戶正式機憑證\n- `platform_fix` 要跑 `npm run test:quiet`：worktree 需有 `node_modules`，測試用 pg-mem 不連真 DB（計畫階段確認 `jest.setup.js` 不需要真實密鑰）\n\n### 4.6 Codex\n\n- 客戶觸發的 agentType **一律強制 provider＝claude＋容器**。設定成 codex 時直接報錯，不默默改用。\n- Codex 只允許內部 agentType，本期不容器化。\n- 本期對 `codex-runner.js` 也套用環境變數白名單（至少拿不到三把總鑰匙）。同 uid 讀檔的風險仍在，列入 §10。\n\n---\n\n## 5. 資料流（一次 AI 執行）\n\n1. runner 要跑 agent → `canRun(scope)` → 產生 runId、登記執行中清單、簽發通行證\n2. `buildAgentRunArgs` → `docker run -i --rm …`；prompt 走 stdin，stream-json 走 stdout——**runner 的解析邏輯不變**\n3. 容器內 claude 經閘道連 Anthropic；需要資料時 `curl $AIDEV_AI_BASE/ai/...`，經閘道 → socket → 平台代查\n4. 結束 → 作廢通行證、移出清單；容器 `--rm` 自動刪除\n\n---\n\n## 6. 錯誤處理\n\n| 狀況 | 現在 | 改成 |\n|---|---|---|\n| 按停止／逾時 | SIGTERM → 5s → SIGKILL 砍 CLI | `docker kill aidev-run-<runId>`，再照原流程結算。**不能只殺子行程**：SIGKILL 送到 docker CLI 不會轉給容器，容器會繼續跑、繼續燒錢 |\n| 平台重啟 | 連帶砍掉 agent | 容器會活下來 ⇒ 啟動時先 `docker rm -f` 所有 **`label=aidev.run` 且 `label=aidev.instance=<本實例 id>`** 的容器，再走現有卡住任務的處理。**一定要帶實例 label**：同一台主機若有 staging 平台，只篩 `aidev.run` 會把另一套正在跑的 AI 一起清掉。通行證清單在記憶體，重啟自然全部作廢 |\n| `--resume` 找不到 session | 無退路 | 偵測到 → 改成全新執行，並在 `task_logs` 寫一行說明。偵測用的錯誤字面**計畫階段實測取得**（故意給一個不存在的 session id 跑一次），比照 `sandbox-signature.js` 只收啟動器自己印的字面，不猜。切換日先把 `~/.claude/projects/` 的現有 session 依 cwd 路徑對應專案，複製進各 scope 的 `data/agent-home/` |\n| 超過記憶體上限（exit 137） | 無 | 錯誤訊息明寫「記憶體上限」；分類為 env、不重試（比照 rules/pipeline 93） |\n| docker 或閘道不可用 | — | 大聲失敗、任務停下。**禁止退回無容器執行**（rules/pipeline 59：fallback 指向最嚴格） |\n| 閘道拒絕某網域 | — | 閘道寫到自己的 stdout（`docker logs aidev-gw` 看得到目的地與來源容器名）；AI 端看到的是連線失敗 |\n| 呼叫端帶了白名單外的 env | — | 丟例外（寫錯 key 不能靜默繞過限制） |\n\n---\n\n## 7. 會改變的既有行為（切換前必須知道）\n\n- **pipeline AI 不再載入使用者層外掛**（superpowers 等）、`~/.claude/CLAUDE.md`、RTK hook ⇒ token 用量與輸出風格可能改變，要試跑比對（§8.4）。\n- **AI 不能再上網查任意網站**（WebFetch／WebSearch）。現有 agent prompt 沒有引用它們，但 claude 內建工具仍可能被 AI 自行拿來用，會失敗。\n- **`platformDB`、`odooGlossary` 兩個 skill 改打 `/ai` 端點。** 改完要跑 `node scripts/sync-skills.js`（rules/always.md 第 13 條）。\n- 互動式 session（你在終端機裡）不受影響。\n\n---\n\n## 8. 測試\n\n### 8.1 單元測試（jest，`app/server/tests/agent-sandbox.test.js`，比照 `docker-env.test.js`）\n\n- 就算 `process.env` 裡有，產出的 env 也**沒有** `APP_SECRET`、`JWT_SECRET`、`DATABASE_URL`\n- 掛載清單只含該 scope 應有的路徑；project scope 不含平台 repo、不含其他專案\n- `.git/config` 與 `.git/hooks` 一定是 ro\n- 網路＝`aidev-agent-net`；一定有 `--rm`、`--cap-drop ALL`、`no-new-privileges`、記憶體上限\n- 白名單外的 env key → throw\n\n### 8.2 `/ai` 範圍（supertest＋pg-mem）\n\n- A 專案的通行證查 B 專案的連線 → 403\n- 過期或已作廢的通行證 → 401\n- 非 internal scope 呼叫 `/ai/platform/query` → 403\n- 從 socket 進來、帶舊全域通行碼 → 401\n\n### 8.3 攻擊實測腳本 `scripts/verify-agent-sandbox.js`（真的開容器，**切換前必須全過**）\n\n- `$APP_SECRET`、`$JWT_SECRET`、`$DATABASE_URL` 皆為空\n- 讀 `/home/odoo/odoo-v2/data/config.json` 失敗\n- 讀其他專案的 repo 路徑失敗\n- 寫 `.git/config`、`.git/hooks/*` 失敗\n- TCP 直連宿主 8772、測試區埠失敗；8771 與 22 在 2026-09-16 實測仍可連到，已依使用者裁決接受此殘餘並補登入鎖定，**不得把兩埠寫成隔離成功**（詳見「開發順序」§0 的 M6）\n- 經閘道連 `api.anthropic.com` 成功；連 `example.com` 被拒\n- 用本次通行證查別專案 → 403；執行結束後再用 → 401\n- 真的跑一次最小的 `claude -p`，再用 `--resume` 接續成功\n\n### 8.4 試跑比對\n\n挑幾種任務類型，容器內外各跑一次，比 `token_usage` 與結果（因為 §7 的行為改變）。\n\n---\n\n## 9. 切換步驟\n\n1. 建映像檔、閘道、internal 網路；平台加 socket listener 與通行證（舊路徑仍在）\n2. 攻擊實測腳本（§8.3）全過\n3. 功能開關 `agent_sandbox`（放 `teams_settings`）預設關 → 先開內部 agent → 再開客戶 agent\n4. 複製 session 檔、重啟平台\n5. 試跑比對（§8.4）\n6. 確認後移除舊的無容器路徑。**子專案 1 開放客戶登入之前，開關必須移除、只剩容器路徑**\n\n---\n\n## 10. 已知風險與未決\n\n| 項目 | 狀態 |\n|---|---|\n| Context7 key 會出現在容器內的 MCP 設定檔（平台的 key） | 接受。外洩影響＝額度被用，可在後台換 key |\n| 本期容器內注入的仍是平台的 Claude 訂閱 token | 客戶登入前只有內部使用；子專案 2 換成各公司自己的 key |\n| 夜間改善 AI 改的平台碼仍會自動合併、在主機上執行 | 容器擋不住。**R6（09-15）接受自動合併**，改擋入口：健檢提案人工核准＋改碼的 AI 查不到平台 DB（§4.5）。剩下的風險＝核准時沒看出全文裡藏的指令（總覽 §6.3） |\n| 容器內的 hook（`scan-guard.js`） | 保留、唯讀掛載，定位是輔助不是防線（總覽 §6.1） |\n| Codex 路徑仍與平台同 uid（可讀 `data/config.json`） | 只給內部用；客戶 agent 禁用 Codex（§4.6） |\n| `--memory`、`--cpus`、`--pids-limit` 數值 | 2026-09-18 已依實測訂為 AI 容器 2g／2 CPU／128 個程式；缺值仍須丟例外（詳見「開發順序」§0） |\n| 全部 agentType 的 cwd 與掛載需求 | 實作計畫第一步逐一對照（含 §2.13 字面漏掉的 `chat`、考試系統）；對不上就停下來問 |\n| `/ai/platform/query` 的敏感欄位遮蔽清單 | 計畫階段列全 |\n"},{"id":"tenant","num":"1","label":"租戶隔離","deps":"前置 0","file":"2026-09-11-tenant-isolation-design.md","md":"# 租戶隔離設計：公司、角色、資料範圍（平台產品化 子專案 1）\n\n日期：2026-09-11\n狀態：P1～P6 已於 2026-09-14 裁決；設計已部分上線，人工驗收與剩餘項目以「開發順序」§0 為準\n前置：子專案 0（AI 執行隔離）必須先完成——沒有它，資料範圍做得再嚴，AI 一句 `echo $APP_SECRET` 就全部繞過\n總覽：`2026-09-11-productize-overview.md`\n\n---\n\n## 1. 目標與非目標\n\n### 目標\n\n多家客戶共用同一套平台，**彼此看不到對方的任何資料、也動不了對方的任何東西**。\n帳號、角色、看得到的頁面照 §2 的裁決。\n\n### 非目標\n\n- AI 執行隔離（子專案 0）\n- 客戶自帶 API key（子專案 2）\n- 客戶自己按關卡、上正式的流程細節（子專案 3）\n- 收費、金流、訂閱到期通知（子專案 4）\n\n---\n\n## 2. 已定調的決定\n\n| 決定 | 日期 |\n|---|---|\n| 一套系統多家客戶共用（SaaS） | 09-10 |\n| 開通由平台管理員代設 repo、測試區、正式機 SSH、DB 連線 | 09-11 |\n| 一家公司多個帳號，分「公司管理員」與「一般使用者」 | 09-11 |\n| 帳號**只綁公司**；看得到該公司綁定的全部專案。分部門以後再說 | 09-11 |\n| 客戶看得到的頁面：問答、任務、Wiki（＋個人設定） | 09-11 |\n| 以下工具**改成只有平台管理員**：DB 查詢頁、DB 連線管理（含 SSH／VPN）、AI 執行畫面、專案／repo 管理、測試環境管理、流程圖／架構圖。上正式另依公司綁定的 `can_release` 授權；考試系統改由公司功能開關決定（客戶預設關閉） | 09-11 原則；上正式與考試依 09-14、09-21 裁決修訂 |\n| **角色只有三種**：平台管理員／公司管理員／一般使用者（取代 09-11 的四種） | 09-14 |\n| **內部人員＝一家「內部公司」的成員**：除了平台管理員，每個帳號都屬於一家公司；內部公司沒有特別權限，靠「綁定全部專案」看到全部 | 09-14 |\n| **一個專案可以掛多家公司**（多對多）；平台管理員新建專案時**自動綁內部公司** | 09-14 |\n| 公司管理員：能管自己公司的帳號；能對「綁定上有勾『可上正式』」的專案按上正式。**內部公司的綁定不勾** ⇒ 客戶專案只有該客戶的公司管理員或平台管理員能按 | 09-14 |\n| AI 用誰的 API key：**發起的人所屬公司**（任務＝建任務的人、問答＝發問的人），細節在子專案 2 | 09-14 |\n| 公司可綁一組 GIT；個人有設用個人的，沒設用公司的 | 09-11 |\n| 客戶也能在個人設定填自己的 GIT（碰不到主機、DB、SSH、VPN 憑證） | 09-11 |\n| 公司有啟用開關＋使用期間，之後走訂閱制 | 09-11 |\n\n---\n\n## 3. 現況事實（2026-09-11 實查）\n\n### 3.1 帳號與角色\n\n- `users.role` 只有 `admin`／`user`；現有 **admin 9 個、user 6 個**，全部是內部人員。\n- `verifyToken` 設 `req.isAdmin = role === 'admin'`（`auth.js:40`）。\n- 另外還有**散落各處自己查 role 的地方**，至少 6 處：`auth.js:40`、`index.js:96`、`index.js:175`、`project-routes.js:37`（`isAdminUser`）、`token-report-routes.js:10`、`pipeline-routes.js:212`。\n- 自助註冊存在：`POST /api/auth/register` 建 `role='user'`、`approved=false`（`auth.js:101`）；登入頁有入口（`ui-next/pages/Login.js`）。\n\n### 3.2 專案與資料範圍\n\n- `projects` **沒有任何主人或公司欄位**（`db.js:189`）。\n- `GET /api/projects` 把**全部專案**回給任何登入的人（`project-routes.js:342`）。\n- 搜尋會用名稱搜到所有專案（`search-routes.js` 專案那段沒有範圍條件）；任務與對話則限本人。\n- 專案端點 12 支裡 11 支只有 `verifyToken`（rules/always.md 11）；`db-query-routes.js`、`env-routes.js` 全部只有 `verifyToken`。\n- **測試區 SSO 只驗登入**：任何人帶任一專案 id 都能進該專案的測試區（`env-routes.js:102`）。\n- 帶 `project_id` 的表：`tasks`、`project_repos`、`project_deploy_targets`、`db_connections`、`odoo_envs`、`project_chats`、`project_favorites`、`wiki_pages`、`wiki_drift`、`wiki_search_misses`、`embedding_chunks`、`classify_samples`、`task_rejections`、`token_usage`。\n\n### 3.3 已經有範圍檢查的地方（好消息）\n\n- **任務**：共用函式 `loadTaskForActor`（`lib/task-access.js:5-11`）＝「本人或 admin」，`pipeline-routes.js` 與 `tasks-routes.js` 的關卡端點都經過它。任務列表非 admin 只看自己的（`tasks-routes.js:218-221`）。\n- **對話**：`getOwnedChat` 限本人；附件下載也經過它（`chat-routes.js:259`）。\n- **任務附件下載**：限本人或 admin（`tasks-routes.js:542`）。\n- **收件匣**：全部 `WHERE user_id = req.userId`（`inbox-routes.js`）。\n- **用量報表**：後端有另查 admin（`token-report-routes.js:8-11`）。\n- **即時推播**：`emitToUser` 走個人房間；全體廣播 `emitAll` 只有考試上傳在用（`exam-upload-routes.js:26`）。\n\n### 3.4 GIT 憑證\n\n- 全平台只有一個入口 `buildGitEnv(userId)`（`lib/git-identity.js:19`），沒有 PAT 就丟 `NoGitCredentialError`。呼叫點 15 處。\n- 上正式合併 main **刻意**只用按的人本人的 PAT、不退機器憑證，理由是歸屬（`project-routes.js:930` 註解）——**本設計依 09-11 裁決推翻此點**。\n- 內部已經有一個「CLI 推送身分」`teams_settings.cli_push_user_id`（`nightly-fix.js:603`）。\n\n### 3.5 前端\n\n- `isAdmin = me.role === \"admin\"`（`ui-next/UiNextApp.js:567`）。\n- 「更多工具」裡的架構圖、流程圖、ODOO 認證輔助**沒有擋 isAdmin**（`UiNextApp.js:1259`）。\n- 隱藏 admin 功能要三處齊做：nav、router guard、後端 403（rules/frontend.md 38）。\n\n---\n\n## 4. 資料模型\n\n### 4.1 新表 `companies`\n\n| 欄位 | 型別 | 說明 |\n|---|---|---|\n| `id` | SERIAL PK | |\n| `name` | TEXT UNIQUE NOT NULL | |\n| `is_active` | BOOLEAN NOT NULL DEFAULT false | 預設安全值；只有平台管理員的建立／啟用端點寫 true（rules/db-schema 43） |\n| `is_internal` | BOOLEAN NOT NULL DEFAULT false | 內部公司記號，**只管付錢**（AI 用平台認證，子專案 2），不管看得到哪些專案。部分唯一索引保證只有一筆 true；**只在遷移時建立，任何 API 都不能設**——客戶公司被誤標成內部，就會用平台的訂閱跑客戶的 AI，違反條款 |\n| `active_from` | TIMESTAMPTZ | 使用期間起（NULL＝不限） |\n| `active_until` | TIMESTAMPTZ | 使用期間迄（NULL＝不限） |\n| `git_pat_enc` | TEXT | 公司 GIT PAT，`lib/crypto.js` 加密 |\n| `git_login`、`git_name`、`git_email` | TEXT | 比照 `users` 同名欄位 |\n| `anthropic_api_key_enc` 等 | — | 子專案 2 補 |\n| `created_at`、`updated_at` | TIMESTAMPTZ | |\n\n### 4.2 既有表加欄位（走 `db.js` 的 ALTER 清單，不改 CREATE TABLE）\n\n| 表 | 欄位 | 意義 |\n|---|---|---|\n| `users` | `company_id INTEGER REFERENCES companies(id)` | NULL **只允許**平台管理員 |\n\n`projects` **不加** `company_id`（09-14 改為多對多，見 §4.3）。\n\n### 4.3 新表 `project_companies`（專案 ↔ 公司，多對多）\n\n| 欄位 | 型別 | 說明 |\n|---|---|---|\n| `project_id` | INTEGER NOT NULL REFERENCES projects(id) **ON DELETE CASCADE** | 不帶 CASCADE 會擋死刪專案（記憶 spec-trio-executed） |\n| `company_id` | INTEGER NOT NULL REFERENCES companies(id) | 公司不刪只停用（子專案 4 客戶離開流程另處理） |\n| `can_release` | BOOLEAN NOT NULL DEFAULT false | 這家公司的公司管理員能不能對這個專案按上正式。預設不勾 |\n| `created_at` | TIMESTAMPTZ | |\n| PK | `(project_id, company_id)` | |\n\n- **寫入檢查**：內部公司（`is_internal=true`）的綁定 `can_release` 必須是 false。\n- **新建專案**：`project-routes.js` 建立專案的同一個交易內，自動插入一筆「內部公司、`can_release=false`」。\n- **只有平台管理員**能新增／移除綁定、改 `can_release`。\n- 共用專案（例：鴻久與鴻伍綁同一個專案）時，兩家都看得到**專案層級的 Wiki**；任務依建立者／公司隔離（一般使用者只看自己的、公司管理員看自家公司），對話只給本人。這是 2026-09-21 已落地的較新權限規則，取代原本「綁定即互相看得到任務與對話」的舊設計；待上正式清單的授權例外見子專案 3 §4.3。\n\n### 4.4 角色：用第三個 role 值，不重用 `admin`\n\n| 身分 | `role` | `company_id` |\n|---|---|---|\n| 平台管理員 | `admin` | NULL（強制） |\n| 公司管理員 | **`company_admin`**（新值） | 必填 |\n| 一般使用者 | `user` | 必填 |\n\n內部公司與客戶公司用的是**同一套**公司管理員／一般使用者，差別只在綁了哪些專案、`is_internal` 決定 AI 用誰的 key。\n\n**為什麼不讓公司管理員也用 `role='admin'`**：§3.1 那至少 6 處散落的 `role === 'admin'` 檢查，只要漏改一處，公司管理員就在那裡變成平台管理員。用新值的話，**既有檢查全部天生把公司管理員擋在外面**——漏改的結果是「公司管理員少一個功能」，不是「客戶拿到平台權限」。\n\n寫入時檢查：`role='admin'` 必須 `company_id IS NULL`；`company_admin`／`user` 必須 `company_id IS NOT NULL`。\n\n### 4.5b 開第一家客戶時，既有資料要不要動？（2026-09-21 釐清，實查後寫入）\n\n**不用。現有使用者與專案一筆都不需要調整。**\n\n實查當日狀態（`users` / `companies` / `project_companies`）：\n\n| 對象 | 現況 | 開客戶時要做什麼 |\n|---|---|---|\n| 9 個平台管理員 | `company_id` 為 NULL | 不動。平台管理員本來就不屬於任何公司 |\n| 7 個內部一般使用者 | 全部掛在「內部」公司 | 不動 |\n| 17 個專案 | 內部公司綁滿 17／17 | **不動，也不要解除綁定** |\n\n**開一家新客戶公司＝三個「新增」，沒有任何「搬移」：**\n\n1. 建立該客戶公司\n2. 把它的專案**加綁**到那家公司（`project_companies` 多一列）\n3. 建立該客戶自己的帳號，`company_id` 指向那家公司\n\n**⚠ 內部公司的綁定必須留著。** 專案↔公司是多對多（§4.3），加綁客戶公司**不會**取代內部公司的綁定。若把內部那一列解除，開發這個專案的自己人就看不到它了——那不是隔離，那是把自己鎖在外面。\n\n**⚠ 共用專案的已知邊界（依 2026-09-21 實作修正）：** 內部與客戶公司同時綁定時，客戶**不會**因此看到內部人員建立的任務或對話；任務看建立者所屬公司，對話只給本人。專案 Wiki 仍是兩家公司共用的內容；有 `can_release` 的公司管理員查看待上正式清單時，也可能看到同一專案中別家已核准的任務，按下上正式會一起帶上（子專案 3 §4.3）。這是已記載的共用專案風險，不再把「任務層級隱藏」誤列成尚未裁決的新需求。\n\n---\n\n### 4.5 既有資料怎麼遷移\n\n- 建一筆內部公司：`is_internal=true`、`is_active=true`、使用期間 NULL。\n- 現有 9 個 admin：`company_id` 留 NULL，role 不動。\n- 現有 6 個 user：`company_id`＝內部公司，role 維持 `user`。\n- 現有 17 個專案：各插一筆綁內部公司、`can_release=false`。平台管理員開通時才另外綁到客戶公司。\n- ⇒ **預設就是客戶什麼都看不到**，不會因為遷移漏掉而外洩。\n- 注意：「鴻久」專案同時掛著鴻久與鴻伍的正式連線（`db_connections` id 2、3）。多對多之後**不必拆專案**，可以兩家都綁；但兩家會互相看得到（§4.3），綁之前要確認。\n- 現有 6 個一般使用者會失去 §2 列的工具，上線前要先告知。\n\n---\n\n## 5. 權限判斷\n\n### 5.1 單點：`verifyToken` 一次載入身分\n\n`verifyToken` 本來每個請求就查一次 `users`（`auth.js:37`）。改成 JOIN `companies`，掛上：\n\n```\nreq.actor = { userId, role, companyId, isPlatformAdmin, isInternal, isCompanyAdmin, companyUsable }\n```\n\n- `req.isAdmin` **語意不變**（仍是 `role === 'admin'`）\n- **公司不可用**（`is_active=false`，或不在 `active_from`～`active_until` 之間）→ 所有 `/api` 回 403「公司帳號已停用或不在使用期間」。只放行 `GET /api/auth/me`，讓前端能顯示原因（登出是前端丟掉 token，不經後端）。\n\n### 5.2 新共用函式（`lib/tenant-access.js`）\n\n| 函式 | 規則 |\n|---|---|\n| `canSeeProject(actor, projectId)` | 平台管理員 → 全部；其他人 → `project_companies` 有 `(projectId, actor.companyId)` 這一筆。**內部公司不特判**，它看得到全部是因為全部都綁了 |\n| `canReleaseProject(actor, projectId)` | 平台管理員；或 `company_admin` 且自己公司對該專案的綁定 `can_release=true`（子專案 3 §4.3 使用） |\n| `loadProjectForActor(id, req, cols)` | 比照 `loadTaskForActor`：看不到回 null → 路由回 **404**（不回 403，避免洩漏「這個 id 存在」） |\n| `loadTaskForActor`（改） | 任務所屬專案必須 `canSeeProject`；一般使用者只看自己的任務，公司管理員可看同公司成員的任務（§8 P1 已決） |\n| `canManageCompanyUsers(actor, companyId)` | 平台管理員，或同公司的公司管理員 |\n\n- 列表類查詢（`GET /api/projects`、搜尋）一律 `JOIN project_companies`，不要撈全部再在 JS 過濾。\n\n### 5.3 各路由檔的改動\n\n| 檔案 | 改成 |\n|---|---|\n| `project-routes.js` | 列表與讀取依 `canSeeProject` 過濾；建立／修改／repo 增刪／reclone／對應設定 → 平台管理員限定；建立時自動綁內部公司（§4.3） |\n| `search-routes.js` | 專案名稱搜尋依 `canSeeProject` 過濾 |\n| `wiki-routes.js`（`/api/...` 部分） | `loadProjectForActor` |\n| `chat-routes.js` | 在某專案下**建立**對話前先 `loadProjectForActor`（現在只驗對話屬於本人，不驗專案看不看得到） |\n| `tasks-routes.js` | 建立任務時驗專案；`loadTaskForActor` 已涵蓋其餘 |\n| `env-routes.js` | SSO 與讀取狀態 → `loadProjectForActor`（客戶驗收要進測試區）；setup／stop／delete → 平台管理員限定 |\n| `db-query-routes.js`（`/api/...` 部分） | 全部 → 平台管理員限定 |\n| `pipeline-routes.js` | 已走 `loadTaskForActor`，隨 §5.2 自動生效；上正式權限見子專案 3 |\n| `exam-routes.js`、`exam-upload-routes.js` | **公司設定的功能開關（客戶預設關閉）**。2026-09-21 使用者裁決推翻原本的「平台管理員限定」，保留內部一般使用者可用。程式已接上功能開關；開第一家客戶前仍須人工驗證公司開／關兩種情境（進度見「開發順序」§0）。 |\n| `settings.js` | 個人 GIT 所有人可用；Odoo 帳密與同步設定對客戶隱藏（§8 P2 已決） |\n| `admin-routes.js` | 維持平台管理員；使用者建立／修改要能設 `company_id` 與 `company_admin` |\n| **新增** `company-routes.js` | 公司管理員管理自家帳號：列出／新增／停用／改角色（只能在 `user`↔`company_admin` 之間），範圍限自己公司。內部公司的公司管理員一樣只管內部帳號 |\n| **新增** 公司管理（admin） | 平台管理員：建立公司、改啟用與期間、綁公司 GIT、**綁定／解除專案與勾選 `can_release`**。`is_internal` 不開放設定 |\n| `auth.js` 註冊 | 關閉自助註冊；帳號只由平台管理員或公司管理員建立（§8 P3 已決） |\n\n### 5.4 靜態守衛（防止以後新增的路由忘記檢查）\n\n新增測試：掃描**全部** route 檔（比照 `frontend-base-path.test.js` 的 `walk()`，不列死檔案清單），凡是路徑含 `/api/projects/:id` 或 `/api/tasks/:id` 的路由，handler 內必須呼叫 `loadProjectForActor`／`loadTaskForActor`，或掛平台管理員 middleware。沒有就紅燈。\n\n### 5.5 前端\n\n- `isAdmin` 維持＝平台管理員；新增 `isInternal`、`isCompanyAdmin`。\n- 「更多工具」裡的架構圖、流程圖、ODOO 認證輔助 → `v-if=\"isAdmin\"`；對應 router 加 `requiresAdmin`。\n- 專案頁的 repo／環境／DB 管理區塊、任務選單的 AI 執行畫面 → 平台管理員限定。\n- 公司管理員多一個「公司帳號」頁。\n- 平台管理員的公司管理頁：每家公司綁了哪些專案、各自有沒有勾「可上正式」。\n- 三處齊做（nav／router／後端 403）。\n\n---\n\n## 6. GIT 憑證改為「個人 → 公司」退回\n\n改單點 `buildGitEnv(userId)`，15 個呼叫端不動：\n\n1. 該使用者有個人 PAT → 用個人的（行為與現在相同）\n2. 沒有，且屬於某家公司（含內部公司）→ 用該公司的 `git_pat_enc`\n3. 沒有，且是平台管理員（無公司）→ **不退回**（09-14 裁決 P4），走第 4 步擋下\n4. 都沒有 → 維持丟 `NoGitCredentialError`\n\n- `project-routes.js:930` 那段「只用本人 PAT、不退機器憑證」的註解與擋法一起改掉，註解改寫成新規則與裁決日期。\n- 回傳值加一個 `source: 'personal' | 'company' | ...`，寫進時間軸，讓人看得出這次是用誰的身分推的。\n- **公司 GIT 綁定時**：對該公司每個專案的 repo 跑一次 `git ls-remote` 驗證可存取，失敗就不存。\n- 順帶解決：自動部署因為系統觸發、找不到人的 PAT 而失敗（見記憶 deploy-fetch-missing-pat）。\n\n---\n\n## 7. 公司可用性的檢查點\n\n| 檢查點 | 公司不可用時 |\n|---|---|\n| `verifyToken`（§5.1） | 客戶登入後所有 API 403 |\n| 子專案 0 的 `canRun(scope)` | 不開 AI 容器、不發通行證 |\n| agent 設成 Codex、而觸發者（任務＝建任務的人；問答＝發問者）屬於**非內部公司**（09-15 子專案 0 計畫 Q3） | 丟例外，訊息寫明「客戶公司的 AI 只能用 Claude」；內部公司成員照常可選 Codex。子專案 0 本身不擋（沒有公司表），這一條必須在本子專案接上，否則客戶的 AI 能經 Codex 繞過容器隔離 |\n| cron 裡的自動推進 | 依**任務建立者所屬公司**判斷（與子專案 2「誰付錢」同一個人），不可用就跳過該任務。一個專案掛多家公司，所以不能用專案判斷 |\n| 正在跑的任務 | **立刻中止**（09-14 裁決 P5）：砍掉該公司所有在跑的 AI 容器，任務停在原地並寫時間軸「公司帳號已停用或到期」。改到一半的程式碼留在任務 worktree、沒有合併，不影響正式 |\n\n---\n\n## 8. 已裁決事項\n\n| # | 問題 | 建議 | 其他選項 |\n|---|---|---|---|\n| P1 | 一般使用者看得到同公司別人的任務嗎？ | **已決 09-14：只看自己的**；公司管理員看全公司；有 `can_release` 的公司管理員另外看得到該專案全部待上正式任務（共用專案時會帶到別家的任務） | — |\n| P2 | 客戶的個人設定要不要保留「Odoo 帳密、同步設定」？ | **已決 09-14：對客戶隱藏**，只留顯示名稱、密碼、個人 GIT | — |\n| P3 | 自助註冊怎麼辦？ | **已決 09-14：關閉**，帳號一律由平台管理員或公司管理員建立 | — |\n| P4 | 平台管理員（沒有公司）沒有個人 GIT 時，退回用誰的？ | **已決 09-14：不退回，擋下**（平台管理員必須自己填個人 GIT；內部公司成員照規則退回內部公司 GIT） | — |\n| P5 | 公司到期或被停用時，正在跑的任務怎麼辦？ | **已決 09-14：立刻中止**（我原本建議跑完這一輪，使用者選立刻中止）；見 §7 | — |\n| P6 | 公司管理員能不能**刪除**自家帳號？ | **已決 09-14：只能停用** | — |\n\n---\n\n## 9. 測試\n\n- **跨公司矩陣**（supertest＋pg-mem）：A 公司的人對 B 公司的專案、任務、對話、wiki、測試區 SSO → 一律 404。\n- **多對多**：專案綁 A、B 兩家 → A、B 都看得到，C 回 404；解除 B 的綁定後 B 立刻 404。\n- **上正式綁定**：A 的公司管理員在 `can_release=false` 時不能按、改 true 後能按；A 的一般使用者兩種情況都不能；內部公司的綁定寫入 `can_release=true` → 拒絕。\n- **新建專案自動綁內部公司**：建完查 `project_companies` 有內部公司那一筆；內部公司的一般使用者看得到。\n- **`is_internal` 不可經 API 設定**：建立／修改公司帶 `is_internal: true` → 被忽略或拒絕，DB 仍只有一筆 true。\n- **工具權限**：平台管理員以外的人（含內部公司成員）呼叫 §2 的平台管理工具 → 403；上正式與考試系統依各自的 `can_release`／公司功能開關測試。\n- **公司管理員不是平台管理員**：呼叫 `/api/admin/*`、`code-zip`、用量報表 → 403。\n- **公司不可用**：`is_active=false`、期間已過、期間未到 → 403；`/api/auth/me` 仍可用；該公司在跑的 AI 被中止（P5）。\n- **測試區 DB 帳號**（§10）：測試區容器的環境變數不含平台 DB 帳密；用測試區帳號連 `aidev` 與別的 `test_*` 被拒；不是超級使用者。\n- **角色寫入約束**：`admin`＋company_id、`company_admin`／`user` 無 company_id → 拒絕。\n- **GIT 退回順序**：個人 → 公司 → （P4）→ 丟例外，各一支。\n- **§5.4 靜態守衛**本身要能紅：刻意拿掉某支路由的檢查，確認測試會紅。\n- **遷移**：既有帳號與專案遷移後，拿一個新客戶帳號登入，列表應為空。\n- 前端沒有自動化測試（rules/frontend.md 30）：平台管理員、內部公司一般使用者、客戶公司管理員、客戶一般使用者各登入一次人工點過。\n\n---\n\n## 10. 測試區資料庫帳號隔離（09-14 新發現，必修）\n\n### 10.1 現況（2026-09-14 實查）\n\n- 測試區 Odoo 連資料庫用的是**平台自己的 `DATABASE_URL`**（`pipeline/env-agent.js:193` `odooDbArgs()`），經 `dbEnvFlags` 以 `-e USER=… -e PASSWORD=…` 傳進容器（`lib/docker-env.js:193-203`）；seed、升級、tour 的 `docker exec` 也用同一組。\n- 那個帳號 `odoo` 是 **PostgreSQL 超級使用者**（`rolsuper=true`）。\n- 同一個 PG（埠 8772）裡同時有平台 DB `aidev` 和**全部客戶的測試區 DB**（09-14 共 17 個 `test_*`）。\n- 測試區 SSO 建出來的帳號**與 admin 同群組**（`idx_aidev_sso/controllers/main.py:54-68`），含 `base.group_system` ⇒ 可以建「伺服器動作」執行 Python。\n- `--db-filter`／`--no-database-list`（`docker-env.js:230`）只擋 Odoo 網頁介面，**擋不住容器裡的 Python 自己連 DB**。\n\n### 10.2 會怎樣\n\n任何進得了測試區的人（09-14 裁決：客戶驗收時就是 admin），或 AI 寫進模組的一段程式碼，都能用超級使用者：\n- 讀平台 DB `aidev`（任務、對話、加密憑證的密文）\n- 讀、改別家客戶的測試區 DB\n- 超級使用者可以 `COPY … TO PROGRAM` 在平台容器裡執行指令 ⇒ 讀 `data/config.json`（總鑰匙）\n\n這條路**不經過 AI 容器**，所以子專案 0 做完也擋不住。\n\n### 10.3 裁決（09-14）\n\n客戶在測試區**維持 admin 權限**（驗收什麼都能試），改靠資料庫帳號把影響鎖在自己的測試 DB（子專案 3 P3）。\n\n### 10.4 做法\n\n| 項目 | 做法 |\n|---|---|\n| 每個測試區一個 PG 角色 | `LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE`，名稱帶測試區 id；密碼隨機產生、`lib/crypto.js` 加密存在 `odoo_envs` |\n| DB 擁有者 | 平台用超級使用者建好 `test_<folder>` 後 `ALTER DATABASE … OWNER TO` 該角色，並在該 DB 內 `REASSIGN OWNED BY odoo TO` 該角色 |\n| 擋連別的 DB | 每個 DB（含 `aidev`、`postgres`、其他 `test_*`）`REVOKE CONNECT … FROM PUBLIC`，只給擁有者；新建測試區時對新 DB 也做 |\n| ⚠ `postgres` 維護庫要補回 | 撤掉 PUBLIC 之後，**必須對該測試區角色單獨 `GRANT CONNECT ON DATABASE postgres`**。Odoo 非連它不可：映像 entrypoint 的 `wait-for-psql.py` 先連 `postgres`（連不到就 `exit 1`，容器只吐一行 `Database connection failure` 就死），之後 `bus` 的 imbus `LISTEN` 與 `ir_cron` 喚醒 worker 也都走 `db_connect('postgres')`。2026-09-16 實測：漏掉這道，測試區**完全建不起來**、狀態永久卡在「建立中」。只放行 `postgres` 一個庫（裡面沒有業務資料，看得到的只有 DB 名單與角色名等共用目錄），`aidev` 與別家 `test_*` 仍然連不進去 |\n| 容器拿到的帳密 | `dbEnvFlags` 與所有 `docker exec` 改用該測試區角色，**不再**傳平台 `DATABASE_URL` 的帳密 |\n| 既有測試區 | 遷移腳本逐一建角色、轉擁有者、重建容器；做完比對「容器環境變數裡沒有 `USER=odoo`」 |\n| 缺角色時 | 大聲失敗、不啟動測試區，**絕不退回**用平台帳號（rules/pipeline 59） |\n\n⚠ 計畫階段要實測：Odoo 以非超級使用者跑 `-i base` 初始化、裝 `unaccent` 等擴充套件是否需要額外權限（擴充套件要超級使用者建，可由平台先建好再轉擁有者）。\n\n### 10.6 09-15 實測結果（推翻上表兩處）\n\n在正式 PG 上用 `drill_*` 臨時角色／DB 實測，已全部清除：\n\n| 項目 | 結果 |\n|---|---|\n| `REASSIGN OWNED BY odoo TO …` | **不能用**：`odoo` 是 initdb 的 bootstrap 超級使用者（oid 10），直接報 `required by the database system`。而且 `REASSIGN OWNED` 會連**其他 DB 的擁有權**一起轉走（用 drill_a 在交易內證實後回滾）⇒ 上表「DB 擁有者」列改為：`ALTER DATABASE … OWNER TO` ＋在該 DB 內逐一 `ALTER TABLE/SEQUENCE/VIEW/ROUTINE … OWNER TO`（排除擴充套件成員、被表擁有的序列），`test_liSheng` 複本 449 個 relation 不到 1 秒轉完、殘留 0 |\n| Odoo 建 DB | 平台沒有任何地方建 DB，是 Odoo `-i base` 時自己建（需 CREATEDB）。改由平台先 `CREATE DATABASE … OWNER <角色> ENCODING 'UTF8' LC_COLLATE 'C' TEMPLATE template0`（與 Odoo 相同）；**DB 已存在時 Odoo 會跳過建 `pg_trgm`**，所以平台要自己建 |\n| 非超級使用者跑 Odoo 17 `-i base`／既有 DB 轉擁有者後 `-u base` | 都 exit 0 |\n| 角色自建 `pg_trgm`／`unaccent` | 可以（trusted extension） |\n| 角色 DDL、trigram 索引 | 可以 |\n| `REVOKE CONNECT … FROM PUBLIC` 後連別的 DB | 擋下（no CONNECT privilege）；超級使用者不受影響，自己的 DB 照連 |\n| `COPY TO PROGRAM`／讀 `pg_authid`／`pg_read_file`／建 DB | 全部擋下 |\n| 看得到其他 DB 名稱 | 看得到（`pg_database` 對所有人可讀），連不進去——接受 |\n| 現況 | 任何非超級使用者現在連得進 `aidev`（讀不到表） |\n\n另：pg_hba 是 `127.0.0.1 trust`＋`10.0.0.0/24 scram`，**從平台容器（host 網路）連 `10.0.0.1` 來源 IP 是 192.168.10.110，不在允許網段**；測試區容器來源是 10.0.0.x 才對得上。平台容器內任何程式經 127.0.0.1 連線不需密碼——子專案 0 的 AI 容器必須連不到宿主 loopback。\n\n### 10.5 排程\n\n跟子專案 0 同級的前置：**任何客戶進測試區之前必須完成**。不依賴公司表，可以提前做。\n"},{"id":"byok","num":"2","label":"客戶自帶 API key","deps":"前置 0、1","file":"2026-09-11-byok-api-key-design.md","md":"# 客戶自帶 API key 設計（平台產品化 子專案 2）\n\n日期：2026-09-11\n狀態：P1～P4 已於 2026-09-14 裁決；認證切換已上線，單張任務花費上限與公司管理員用量報表已完成程式實作、待上線驗證；預設金額仍待裁決（進度以「開發順序」§0 為準）\n前置：子專案 0（容器與環境變數白名單）、子專案 1（公司）\n總覽：`2026-09-11-productize-overview.md`\n\n---\n\n## 1. 目標與非目標\n\n### 目標\n\n- 客戶觸發的 AI **一律用發起者所屬公司自己的 Anthropic API key**，費用由 Anthropic 直接算給客戶（09-14：一個專案可掛多家公司，所以看「人」不看「專案」）。\n- 平台**不代付、不轉售、不中介** Claude 用量（Anthropic 條款要求）。\n- key 加密保存，永遠不回傳瀏覽器。\n- 單張任務有花費上限，避免客戶收到嚇人的帳單。\n\n### 非目標\n\n- 跟 Anthropic 業務談轉售（使用者裁決 09-11：不談）\n- Codex（只留內部，09-11 裁決）\n- 平台服務費怎麼收（子專案 4）\n\n---\n\n## 2. 已定調的決定\n\n| 決定 | 日期 |\n|---|---|\n| 客戶自帶 API key（BYOK） | 09-11 |\n| key 由客戶管理員填（拆法 v2 核准時一併定下） | 09-11 |\n| 非客戶觸發的 AI（健檢、夜間改善、內部專案）用平台自己的認證 | 09-11 |\n| 客戶只用 Claude | 09-11 |\n\n---\n\n## 3. 現況事實（2026-09-11 實查）\n\n### 3.1 Anthropic 條款（code.claude.com/docs/en/legal-and-compliance）\n\n- 「Customers may not pay for, resell, or intermediate Claude usage on their end users' behalf. Each end user must authenticate with their own Anthropic API key, Claude subscription plan credentials, or 3P inference provider credential」\n- 「Anthropic does not permit third-party developers … to route requests through Free, Pro, or Max plan credentials on behalf of their users.」\n- 在產品裡跑 Claude Code 需要同意 **Commercial Terms**，且「The Claude Code binary must not be modified」、不得移除或限制它內建的認證方式。\n- 名稱與 logo：可以照實說「產品裡跑的是 Claude Code」，但**不能**把 Claude Code／Anthropic 的名稱或 logo 放進自己的產品名、公司名或 logo。\n\n### 3.2 平台現在的認證\n\n- 管理員設定的訂閱 OAuth token 存在 `teams_settings.claude_oauth_token_enc`，另有備用一組（`lib/claude-auth.js`）。\n- 注入只有一個點：`claude-runner.js:197` 的 `getClaudeAuthEnv()`（rules/infra 131）。\n- `usage-gate.js:64-130` 依訂閱視窗的用量百分比，在主／備用之間切換。\n- rules/infra 134 寫「用量閘門必須是全域的」——**這個前提在 BYOK 之後只對平台自己的認證成立**。\n- 認證優先序：`ANTHROPIC_AUTH_TOKEN` > `ANTHROPIC_API_KEY` > `CLAUDE_CODE_OAUTH_TOKEN`（`claude-auth.js:81`）。官方說明：`-p` 模式下只要有 `ANTHROPIC_API_KEY` 就一定用它。\n- `start.sh:50-51`：`data/config.json` 若有 `ANTHROPIC_API_KEY` 會 export 進平台環境（子專案 0 的白名單會擋住它流進 AI）。\n- 驗證 token 的既有做法：用那組 token 跑一次 `runClaude('回覆 ok')`（`admin-routes.js:75`）。\n\n### 3.3 花費\n\n- `token_usage` 每次 AI 執行記一筆（含 `user_id`、`project_id`）；成本換算在 `lib/token-cost.js`（`costSql`、`RATES`）。\n- ⚠ `token_usage` **會低估**：失敗那一輪不記帳、子 agent 的用量沒算進去（記憶 token-usage-underreports-cost）。\n- `claude --help`：`--max-budget-usd <amount>`「Maximum dollar amount to spend on API calls (only works with --print)」。pipeline 用的正是 `-p`。\n- stream-json 的 `result` 事件帶 `total_cost_usd`（runner 在 `claude-runner.js:291` 解析 result）。\n\n---\n\n## 4. 設計\n\n### 4.1 儲存\n\n`companies` 加欄位：\n\n| 欄位 | 說明 |\n|---|---|\n| `anthropic_key_enc` | `lib/crypto.js` 加密；目前已實作，名稱以實際資料庫欄位為準 |\n| `anthropic_key_last4` | 畫面上顯示「••••abcd」用 |\n| `anthropic_key_set_by`、`anthropic_key_set_at` | 誰、什麼時候設的 |\n| `anthropic_key_verified_at` | 最後一次驗證成功時間 |\n| `task_budget_usd` | 單張任務花費上限（§4.5） |\n\nGET 只回是否已設定與後四碼，**永遠不回原文**（比照記憶 password-no-longer-returned-to-browser）。目前管理員 API 只回 `has_anthropic_key`，後四碼、設定者與時間尚未實作；這些欄位不能因目前沒有就視為已完成。PUT 沒帶 key 就沿用舊值。\n\n### 4.2 誰能設\n\n- 公司管理員：在新的「公司設定」頁填（內部公司不需要填）。\n- 平台管理員可代填（§8 P1 已決）。目前只有平台管理員的 API／畫面已實作，公司管理員自行填 key 的入口仍待做。\n\n### 4.3 存檔前驗證\n\n用這把 key 跑一次最小的 `claude -p`（把環境變數換成 `ANTHROPIC_API_KEY`）。**認證失敗就不存**；網路或服務暫時失敗時可儲存，但必須明確告知「未完成驗證」，不得顯示成驗證成功。\n這次驗證本身也要走子專案 0 的容器。\n\n### 4.4 注入規則\n\n子專案 0 容器白名單裡的「Claude 認證」這一項，照下表決定：\n\n**09-14 裁決：看「發起的人」所屬公司，不看專案**（一個專案可以掛多家公司，子專案 1 §4.3）。\n\n「發起的人」：\n- 任務的每一關（分析、開發、QA、重跑、自動推進）＝**建任務的人**（`tasks.user_id`），不管實際是誰按下重跑\n- 問答＝發問的人（`project_chats.user_id`）\n\n| 發起的人 | 用哪個認證 |\n|---|---|\n| 屬於一般公司（`is_internal=false`） | 該公司的 `ANTHROPIC_API_KEY` |\n| 屬於內部公司（`is_internal=true`） | 平台現行認證（`getClaudeAuthEnv()`＋用量閘門） |\n| 平台管理員（無公司） | 平台現行認證 |\n| scope `internal`（健檢、改善） | 平台現行認證 |\n\n- 例：內部人員在鴻久的專案上發問 ⇒ 用平台認證（你付）；鴻久的人在同一個專案上發問 ⇒ 用鴻久的 key。\n- 公司可用性（啟用、使用期間）也看同一家公司。\n\n- **公司沒設 key → `canRun` 回 false**：不開容器，任務停在原地，時間軸寫「公司尚未設定 API key」，通知客戶管理員。\n- **絕不退回用平台的認證**（條款不允許，而且 rules/pipeline 59 要求 fallback 指向最嚴格）。\n- 平台的用量閘門 `usage-gate.js` **只套在平台認證**。客戶 key 沒有「訂閱視窗百分比」這種東西，不套。\n\n### 4.5 單張任務花費上限\n\n一張任務會跑很多次 AI（分析、開發、QA、重跑……），`--max-budget-usd` 只管單次，所以要兩層：\n\n1. **開跑前**：算這張任務已經花掉多少（`token_usage` 依 task 加總，用 `costSql`）。已花 ≥ 上限 → 不開跑，任務停下，時間軸寫白話原因，客戶管理員可以提高上限後按繼續。\n2. **跑的時候**：傳 `--max-budget-usd <上限 − 已花>` 給這一次執行。\n\n**讓累計數字更準**：`token_usage` 新增 `cost_usd` 欄位，直接記 `result` 事件的 `total_cost_usd`（有這個值時優先用它，沒有才用 `costSql` 估）。\n沒有產生 `result` 的失敗輪仍然會漏記，列入 §9 已知風險。\n\n上限預設值依 §8 P2：先用歷史任務的 p90／p99 算出候選數值，再由產品負責人確認；尚未有已核准的美元數值。\n\n2026-09-23 本地資料庫 67 張有用量的任務，依現行估算式得到 p90 約 US$5.81、p99 約 US$28.20，最高約 US$45.94。這是候選數值，不包含沒有產生 `result` 的失敗輪；正式預設仍為 `NULL`（不啟用），待產品負責人裁決後才設定。程式實作在每次容器 AI 呼叫前重算餘額；若有上限而完整容器模式未啟用，任務直接停止，避免舊路徑繞過限制。\n\n2026-09-23 續查：格式補救、部署失敗分類、退回分類與任務衍生的 Wiki 漂移分類也須帶原任務的 DB ID，才能吃到同一筆剩餘額度。背景分類找不到原任務時不開 AI；人工退回的分類以任務建立者（非按退回的人）認證與記帳。\n\n### 4.6 錯誤處理\n\n| 狀況 | 做法 |\n|---|---|\n| key 無效或被撤銷 | 停下、不重試；通知客戶管理員「API key 無效」；公司的 `anthropic_key_verified_at` 清空 |\n| 客戶的 Anthropic 帳戶額度不足 | 停下、不重試；通知客戶管理員 |\n| 超過單張任務上限 | 停下（§4.5） |\n| 被限流（429） | 視為暫時性錯誤，沿用現行重試上限 |\n\n⚠ 上面各種錯誤的**實際錯誤字面**，計畫階段拿真 key 實測取得（例如故意用撤銷的 key、額度 0 的帳戶），比照 `auth-signature.js`／`sandbox-signature.js` 只收 CLI 自己印的字面，**不猜**。\nrules/infra 132：`Not logged in` 這類認證錯誤走 stdout 不走 stderr，兩邊都要掃。\n\n### 4.7 客戶看得到花費嗎\n\n公司管理員可看自家公司用量報表，後端強制公司範圍；平台管理員可依公司篩選。Claude 訂閱額度頁不開給客戶（§8 P3 已決）。\n\n用量列會記下執行當下的 `company_id`，公司報表只讀該快照，不依帳號目前所屬公司重算。上線前沒有公司快照的舊用量列不回填到客戶報表，避免帳號移轉後把別家歷史費用誤歸給新公司；平台管理員原有全平台報表仍可查舊資料。\n\n### 4.8 條款遵循（不是程式，但上線前一定要做）\n\n- 以平台營運者身分同意 Anthropic **Commercial Terms**。\n- Claude Code 用 npm 官方套件原版安裝（子專案 0 的映像檔已是如此），不改 binary。\n- 產品名稱、logo 不含 Claude Code／Anthropic 字樣。\n- 服務條款寫明「AI 用量費用由客戶與 Anthropic 直接結算」（子專案 4）。\n\n---\n\n## 5. 測試\n\n- key 加解密；GET 絕不回原文；PUT 不帶 key 沿用舊值。\n- **注入矩陣**：一般公司的人 → 該公司 key；內部公司的人／平台管理員 → 平台認證；`internal` → 平台認證；**同一個專案綁兩家公司，兩家的人各自發起 → 各用各的 key**；內部人員重跑客戶建的任務 → 仍用客戶公司的 key；公司沒 key → `canRun` false 且**不會**拿到平台認證（這條最重要，要單獨一支測試）。\n- 用量閘門切換主／備用，不會影響客戶 key 的執行。\n- 花費上限：已花 ≥ 上限 → 不開跑；未達 → 傳入的 `--max-budget-usd` 等於剩餘值；`cost_usd` 有值時優先於估算。\n- 錯誤分類：用實測取得的字面寫 signature 測試。\n\n---\n\n## 6. 會改變的既有行為\n\n- 客戶專案的任務，**不再**受平台訂閱用量閘門影響，也不會消耗平台的訂閱額度。\n- rules/infra 134「用量閘門全域」要改寫成「只管平台自己的認證」。\n\n---\n\n## 7. 切換步驟\n\n1. 子專案 1 上線（公司存在）\n2. 加欄位、公司設定頁、驗證、注入規則\n3. 用你自己開的一把測試 key 建一家測試公司，完整跑一張任務，對帳：平台 `token_usage.cost_usd` 加總 vs Anthropic Console 顯示的花費\n4. 對得上才開放給真客戶\n\n---\n\n## 8. 已裁決事項\n\n| # | 問題 | 建議 | 其他選項 |\n|---|---|---|---|\n| P1 | 平台管理員能不能在開通時**代填**客戶的 key？ | **已決 09-14：可以代填**，記下 `set_by`；公司管理員之後可以自己換 | — |\n| P2 | 單張任務上限的預設值？ | **已決 09-14：先用歷史資料算再訂**（`token_usage` 每張任務花費的 p90、p99）；公司管理員可自己調 | — |\n| P3 | 客戶看得到花費嗎？ | **已決 09-14：沿用現有用量報表**（`token-report-routes.js`），加「公司」條件＝該公司成員發起的執行。報表開給公司管理員，後端**強制**只回自家公司（不吃客戶帶的篩選參數）；平台管理員多一個公司篩選。Claude 訂閱額度頁（usage）不開給客戶——客戶自帶 key 沒有訂閱百分比。報表低估成本的問題照 §4.5 的 `cost_usd` 欄位處理 | — |\n| P4 | 同一家公司能不能不同專案用不同 key？ | **已決 09-14：不行，一家一把** | — |\n\n---\n\n## 9. 已知風險\n\n| 項目 | 狀態 |\n|---|---|\n| 失敗輪沒產生 `result` 事件時漏記花費 ⇒ 實際花費可能超過平台算的上限 | `--max-budget-usd` 仍在單次執行層擋住；平台累計數字標示「估算」 |\n| key 在 AI 容器的環境變數裡，被注入時 AI 讀得到 | 接受：那是客戶自己的 key，只能花客戶自己的錢；容器隔離確保拿不到別家的 |\n| Anthropic 改條款 | 上線前、之後每半年重讀一次 legal-and-compliance 頁 |\n"},{"id":"exambyok","num":"2b","label":"考試改用客戶的 key","deps":"前置 2","file":"2026-09-24-exam-byok-design.md","md":"# 考試系統改用客戶自己的 API key 設計（平台產品化 子專案 2 的延伸）\n\n日期：2026-09-24\n狀態：設計已於 2026-09-24 經使用者逐節確認；**程式已實作、測試全綠，但未重啟、未人工驗收**\n實作紀錄：全跑 402 suites／5907 tests，新增 24 項全過，失敗數與動手前的基線完全相同（4 項，\n都在 `frontend-base-path` 與 `frontend-auth-reactivity` 這兩支既有紅燈上，與本次無關）。\n§6 那兩項人工驗收尚未執行。\n前置：子專案 2（`2026-09-11-byok-api-key-design.md`，`buildClaudeAuthEnv` 已上線）、子專案 1（公司表）\n總覽：`2026-09-11-productize-overview.md`；進度以「開發順序」§0 為準\n\n---\n\n## 1. 目標與非目標\n\n### 目標\n\n- 考試系統的 AI 執行**一律用發起者所屬公司自己的 Anthropic API key**，與 pipeline 同一條判準（`lib/claude-auth.js` 的 `buildClaudeAuthEnv`）。\n- 客戶公司沒有設定 key 時**必須失敗**，不得靜默退回廠商的平台訂閱。\n- 判題品質**逐字不變**：送進 AI 的 prompt、參數、工具、模型完全不動，只有認證憑證換人。\n\n### 非目標（本輪刻意不做）\n\n這些是 2026-09-24 使用者在四個選項中只挑了「客戶自帶 key」的直接結果，不是遺漏：\n\n- **記帳**：考試花費仍不進 `token_usage`，用量報表看不到考試。\n- **進容器**：考試 AI 仍在主機上跑。兩道既有的工具閘門因此得以保留——`review.js` 的 `--allowed-tools`（有截圖才給 `Read`，否則空字串）與 `challenge.js` 的 `--disallowed-tools`；`runClaude` 兩者都不支援。\n- **花費上限**：考試沒有「任務」這個單位，`--max-budget-usd` 無處可掛。\n- **可中止**：`exam-upload-routes.js:192` 註解描述的既有限制（公司被停用時正在跑的那一輪會跑完）仍然存在。\n- **題庫的跨公司可見性**：`GET /api/exam/banks` 至今沒有公司過濾，所有開了考試功能的公司互看得到彼此的題庫。**這是獨立的缺陷，開第一家客戶之前必須處理，但不在本設計範圍**。\n\n---\n\n## 2. 現況實查（2026-09-24）\n\n| 事實 | 位置 |\n|---|---|\n| 考試自己 spawn `claude`，完全不經平台 AI 通道 | `lib/exam/review.js:402`、`lib/exam/challenge.js:192`、`lib/exam/evidence.js:369` |\n| env 白名單只放行系統變數，**含 `HOME`** ⇒ 實際吃的是主機 `~/.claude` 的互動式登入憑證 | `lib/agent-env.js` 的 `LEGACY_ENV_KEYS` |\n| 考試資料表**沒有任何 `company_id` 或 `user_id`** | `exam_banks`／`exam_uploads`／`exam_attempts` 只有文字欄 `responder` |\n| 上傳通行碼是**全平台唯一一組**，存在 `data/exam/upload-token.json`，不屬於任何人 | `lib/exam/upload.js` 的 `issueUploadToken` |\n| 本機（127.0.0.1）來的上傳**免 token** | `lib/exam/upload.js` 的 `isLocal`＋`checkExamToken` 第一行 |\n| JWT 路徑驗出了 `payload.userId` 卻**沒有留下來** | `exam-upload-routes.js:68` 之後只 `next()` |\n| 判題常常**不在請求當下發生**：6 個 `scheduleQueue()` 觸發點中，平台重啟續跑與取消暫停兩條完全沒有發起人 | `index.js:415`（`reclaimInterrupted` → `scheduleQueue`）、`exam-upload-routes.js:391` |\n| `evidence.js` 的 spawn **網頁到不了**，唯一呼叫端是手動 CLI | `tools/exam-review-run.js:111` |\n| 平台管理員設定的 Claude token **已設定** | 查 `teams_settings`：`claude_oauth_token_enc` 非 null，備用為 null |\n\n### 為什麼不能「只看 token、不存身分」\n\n2026-09-24 使用者提出：「token 進來後看是誰的就用誰的 AI 去判題」。這個判準對大部分請求成立，但有三個洞：\n\n1. **本機免 token**：根本沒有 token 可看。\n2. **共用通行碼不屬於任何人**：一整台平台一組，看得出「有碼」，看不出「是誰」。\n3. **判題活得比請求久**：`scheduleQueue` 是丟出去就不管的；平台重啟續跑那條路上，發起該次上傳的請求早就結束了。而 `buildClaudeAuthEnv(null)` 的行為是「用平台訂閱」——客戶的考試只要遇到一次重啟，錢就靜靜回到廠商頭上，而且不報錯。\n\n結論：身分必須在上傳那一刻**寫進資料列**，才撐得過重啟。裁決為「記在那一頁上」，而非題庫層——錢是逐頁燒的，逐頁記更準。\n\n---\n\n## 3. 設計\n\n### 3.1 身分寫入（上傳時）\n\n- `exam_uploads` 新增 `user_id INTEGER REFERENCES users(id)`，**可為 null**（null ＝內部，用平台訂閱）。\n- 全專案只有一處 INSERT 這張表（`exam-upload-routes.js:172`），加一欄即可。\n- `checkExamToken` 解析出身分後放進 `req.examUserId`，三條路各自的落點：\n\n| 進來的路 | `req.examUserId` | 理由 |\n|---|---|---|\n| 本機 127.0.0.1（免 token） | `null` | 這台機器自己＝廠商，本來就該用平台訂閱 |\n| 平台帳號 JWT | `payload.userId` | 已經驗出來了，只是現在丟掉 |\n| 共用通行碼 | 通行碼檔新增的 `issued_by` | 同時只有一把有效（重產即失效），沒有歧義 |\n\n- `issueUploadToken(dataDir, issuedBy)` 多寫一欄 `issued_by`；`peekUploadToken` 一併回傳。\n- **舊的通行碼檔沒有 `issued_by`** ⇒ 讀到 undefined 時當 `null`（內部）。這是相容處理，不是預設值：舊碼效期只有 3 小時，升級後很快就會被重產取代。\n\n### 3.2 憑證解析（判題時）\n\n- `worker.js` 在每頁開跑前 `await buildClaudeAuthEnv(upload.user_id)`，把回傳的 env 物件沿著呼叫鏈往下傳：\n  - `challengePage(...)` → `challenge.js` 的 spawn\n  - `extractPage(...)` → `review.js` 的 `runPrompt` → spawn\n- 讀章節那條路（`POST /api/exam/banks/:id/read-sections`）走 `verifyToken`，直接用 `req.userId` 解析後傳進 `readSections`。\n- 合併順序：**`{ ...pickLegacyEnv(process.env), ...authEnv }`**。authEnv 必須在後面——官方認證優先序是 `ANTHROPIC_AUTH_TOKEN` > `ANTHROPIC_API_KEY` > `CLAUDE_CODE_OAUTH_TOKEN` > 憑證檔，而 `pickLegacyEnv` 放行的 `HOME` 會讓憑證檔可讀，順序寫反就會靜默沿用舊行為（測試看不出來，因為兩種都「跑得起來」）。\n- `evidence.js` **不動**：唯一呼叫端是手動 CLI，發起人就是廠商本人。\n\n### 3.3 沒有 key 的客戶\n\n- `buildClaudeAuthEnv` 丟 `NoAnthropicKeyError`（`code = 'NO_ANTHROPIC_KEY'`）。**不攔、不轉譯**，讓它沿既有的單頁失敗路徑走（`worker.js` 的 catch 會把該頁標 `failed` 並記下訊息）。\n- 訊息本身已經是給人看的白話：「這家公司還沒有設定 Anthropic API key，AI 無法執行。請公司管理員在設定頁填入。」\n- **不得有任何 fallback 到平台訂閱的分支**。`companies.is_internal` 的欄位註解已寫明理由：靜默退回不會報錯，只會在月底的帳單上出現。\n- 公司停用／過期時 `buildClaudeAuthEnv` 同樣丟這個例外（它內部呼叫 `isUserCompanyUsable`），走同一條路，不另開分支。\n\n### 3.4 刻意不動的\n\nprompt 文字、CLI 參數、`cwd`、`model`、MCP 設定檔（`lib/exam/mcp/none.json`）、兩道工具閘門（`review.js` 的 `--allowed-tools`、`challenge.js` 的 `--disallowed-tools` 與 `--append-system-prompt`）、逾時長度——全部逐字不動。這是 §4 品質關卡成立的前提。\n\n### 3.5 已知的副作用（使用者已確認接受）\n\n改動前，考試 AI 吃主機 `~/.claude` 的互動式登入憑證；改動後，內部（`user_id` 為 null 或內部公司）會改用**平台管理員設定的那把 token**（實查已設定）。\n\n兩者都是廠商的帳，但確實換了一把。這是刻意的：與 pipeline 一致，並避開 `lib/claude-auth.js` 檔頭記載的老問題——併發 spawn 共用會被刷新改寫的憑證檔，在 token 輪替瞬間互相踩空而出現 \"Not logged in\"。\n\n若平台 token 未設定，`getClaudeAuthEnv()` 回空物件、完全不碰該 key，行為與今天相同（仍讀憑證檔）。\n\n---\n\n## 4. 品質關卡\n\n需求原句是「必須有逐題比對的品質關卡——搬錯會讓判題品質悄悄改變，過去的考試成績就不能拿來比」。\n\n**不能用「同一頁跑兩次比對結果」來驗**：同一份 prompt 送兩次，模型本來就會給出不同措辭，差異全部來自取樣，證明不了任何事。誤把它當關卡，只會得到一個永遠紅或永遠要人肉判讀的測試。\n\n真正驗得動的是**輸入逐字相同**：\n\n1. **spawn 參數快照**：對 `review.js` 與 `challenge.js` 各鎖一支測試，斷言改動前後 `args`、`prompt`、`cwd`、`model` 完全一致，**差異只出現在 env 的認證欄位**。\n2. **身分解析**：四條路各一支（本機、JWT、通行碼、`verifyToken`），斷言落進 `exam_uploads.user_id` 的值。\n3. **沒 key 的客戶**：那一頁標 `failed`、訊息可讀、且**沒有任何** spawn 發生（證明沒有 fallback）。\n4. **重啟續跑**：`reclaimInterrupted` 之後重跑，`user_id` 從 DB 讀得回來、不是 null。\n5. **合併順序**：authEnv 覆蓋得過 `pickLegacyEnv` 的結果（防 §3.2 那個寫反也不會報錯的坑）。\n\n---\n\n## 5. 影響範圍\n\n| 檔案 | 動什麼 |\n|---|---|\n| `app/server/db.js` | `exam_uploads` 加 `user_id`（migration） |\n| `app/server/lib/exam/upload.js` | `issueUploadToken` 存 `issued_by`；`peekUploadToken` 回傳 |\n| `app/server/exam-upload-routes.js` | `checkExamToken` 產出 `req.examUserId`；INSERT 加一欄；`read-sections` 傳 `req.userId` |\n| `app/server/lib/exam/worker.js` | 每頁解析 authEnv 並往下傳 |\n| `app/server/lib/exam/review.js` | `runPrompt`／`extractPage` 收 authEnv 並合併進 spawn env |\n| `app/server/lib/exam/challenge.js` | `challengePage` 同上 |\n| `app/server/lib/exam/sections.js` | `readSections` 把 authEnv 轉交 `runPrompt` |\n| `app/server/lib/exam/evidence.js` | **不動** |\n\n---\n\n## 6. 驗收\n\n- 全跑不得有新紅燈（基線在實作前自己量，見 `.claude/rules/always.md` 第 2 條）。\n- 上述 5 項品質關卡測試全綠。\n- **人工**：以內部帳號跑完一場考試（確認換 token 後判題照常）；以一家沒設 key 的客戶公司帳號上傳一頁（確認該頁失敗且訊息看得懂，不是靜默成功）。這兩項無法用測試取代——前者驗的是「換了憑證仍跑得動」，後者驗的是「失敗訊息真的到得了畫面」。\n"},{"id":"examscope","num":"2c","label":"考試的租戶隔離","deps":"前置 1、2b","file":"2026-09-24-exam-tenant-scope-design.md","md":"# 考試系統的租戶隔離設計（開第一家客戶前的阻擋條件）\n\n日期：2026-09-24\n狀態：**程式已實作、測試全綠，但未重啟、未人工驗收**（2026-09-24，commit `d10d7e3a`）\n實作紀錄：全跑 405 suites／5996 tests／0 失敗。基線 5922 → +74，與預測一致（新測試 73＋新原始碼檔 1 的全樹守衛）。\n§5 那一項人工驗收尚未執行。實作時與設計的唯一差異：`seesAllBanks` 把「沒有公司」也算內部——\n那是全平台既有慣例（`tenant-access` 的 `isUserCompanyInternal`、`company-features`、`agent-home` 都這樣判），\n設計當下沒寫出來，第一次全跑就被既有測試打臉（沒有公司的一般使用者看不到內部場次）。\n前置：子專案 1（公司表）、`2026-09-24-exam-byok-design.md`（`exam_uploads.user_id` 已上線）\n總覽：`2026-09-11-productize-overview.md`；進度以「開發順序」§0 為準\n\n---\n\n## 1. 目標與非目標\n\n### 目標\n\n- 客戶公司**能用考試作戰台**（`/exam-run`：傳自己的考卷、AI 判題、投票定案、歸檔），但**只看得到自己公司的考試場次**。\n- 客戶公司**完全看不到題庫管理頁**（`/exam-bank`：瀏覽累積的題目、標歷史錯題）——那是內部的東西。\n- 前後端判準**一致**。今天前端 router 擋死兩頁、後端 `requireFeature('exam')` 放行，這個不一致本身就是洞。\n\n### 非目標（使用者 2026-09-24 裁決）\n\n- **題目池不分家**。`exam_items` 的鍵是 `UNIQUE (odoo_version, fingerprint)`，一個 Odoo 版本一池，「越考越準」整個機制就是靠跨場次累積在這池裡。分家等於每家客戶從零開始、累積歸零。\n  - 由此產生、**使用者已知並接受**的兩件事：客戶的考卷會用到內部累積出來的官方答案（`answer_official`／`certain`）；客戶的題目也會併進那個池，內部之後看得到。客戶看不到內部的**場次與截圖**，但答案知識是互通的。\n- 考試花費的記帳、進容器、花費上限（見 `2026-09-24-exam-byok-design.md` §1）。\n\n---\n\n## 2. 現況實查（2026-09-24）\n\n| 事實 | 位置 |\n|---|---|\n| 考試端點共 **24 支**，全部只掛 `verifyToken` ＋ `requireFeature('exam')`，**沒有任何一支問「這場是誰的」** | `exam-routes.js`（6 支）、`exam-upload-routes.js`（18 支） |\n| `GET /api/exam/banks` 是裸的 `SELECT ... FROM exam_banks`，沒有 WHERE | `exam-routes.js:26` |\n| 前端 router 對 `/exam-bank` 與 `/exam-run` **都**掛 `requiresInternal`，後端卻放行 | `app/public/js/app.js:208`、`:214` |\n| 上傳沒指定場次時自動挑「還沒結束的那一場」——**客戶的考卷會掉進內部正在進行的場次** | `exam-upload-routes.js` 的 `resolveBank` |\n| 上傳通行碼是**全平台唯一一把**，存在單一檔案，重產即舊的失效 | `lib/exam/upload.js` 的 `issueUploadToken` |\n| `exam_uploads.user_id` 已經記了每一頁是誰傳的 | 2026-09-24 BYOK 那輪加的 |\n| `GET /api/exam/lookup`、`GET /api/exam/versions` **沒有任何前端呼叫端**（推測是外部截圖腳本用） | grep `app/public/`、`tools/` 皆無 |\n\n### 為什麼場次要加欄位，不能從上傳推\n\n「這場屬於哪家公司」理論上可以從 `exam_uploads.user_id` 推。**但空場次推不出來**：`POST /api/exam/banks`（開一場新考試）建出來的場次一張截圖都沒有，於是建立它的人當場就看不到它。自動建場次（`resolveBank`）也一樣，建立與第一次上傳之間有空窗。\n\n所以 `exam_banks` 要有 `company_id`，在**建立當下**寫入。這與 2026-09-24 稍早「BYOK 不必綁題庫」的結論不衝突：那時問的是「錢算誰的」，答案是逐頁記更準；這裡問的是「這場給誰看」，答案必須在場次本身。\n\n---\n\n## 3. 設計\n\n### 3.1 場次歸屬\n\n- `exam_banks` 新增 `company_id INTEGER REFERENCES companies(id) ON DELETE SET NULL`，**可為 null＝內部**（與 `exam_uploads.user_id` 同一個約定）。\n- 寫入時機：\n  - `POST /api/exam/banks`（手動開一場）→ 建立者的 `company_id`（內部人員為 null）。\n  - `resolveBank` 自動開一場 → **上傳者**的 `company_id`（`req.examUserId` 推出來）。\n- 既有資料一次性遷移：全部維持 null（＝內部）。目前只有內部在用，這是事實而非假設。\n\n### 3.2 可見範圍\n\n單一判準，寫成一支函式 `examBankScope(actor)`（放 `lib/exam/scope.js`），比照 `lib/tenant-access.js` 的形狀：\n\n| 身分 | 看得到的場次 |\n|---|---|\n| 平台管理員 | 全部 |\n| 內部公司成員 | 全部 |\n| 客戶公司成員 | `company_id = 自己公司` 的那些 |\n\n**看不到一律回 404 不回 403**（專案既有原則：403 等於告訴對方「這個 id 存在」）。\n\n### 3.3 端點分類（24 支）\n\n**A. 題庫管理 → 內部限定**（新增 `requireInternal` 中介層，非內部一律 404）\n\n| 端點 | 說明 |\n|---|---|\n| `GET /api/exam/sections` | 瀏覽章節與題目清單 |\n| `GET /api/exam/items/:id` | 單題詳情（含累積出來的官方答案） |\n| `PATCH /api/exam/items/:id/history-wrong` | 標歷史錯題 |\n| `GET /api/exam/versions` | 版本切換（題庫頁用） |\n| `GET /api/exam/lookup` | 指紋查詢既有題目 |\n\n**B. 考試作戰台 → 客戶可用，但要綁場次**（先解出場次 id，再過 `examBankScope`）\n\n| 端點 | 場次從哪來 |\n|---|---|\n| `GET /api/exam/banks` | 清單本身 → 加 WHERE |\n| `POST /api/exam/banks` | 建立 → 寫入歸屬（§3.1） |\n| `POST /api/exam/submit`、`POST /api/exam/batch` | `resolveBank` → §3.4 |\n| `POST /api/exam/run` | `body.bank` |\n| `POST /api/exam/banks/:id/pause`、`/archive`（GET＋POST）、`/read-sections`、`DELETE /attempts` | `params.id` |\n| `GET /api/exam/jobs`、`/uploads`、`/dashboard` | `query.bank` |\n| `POST /api/exam/uploads/:id/retry` | upload → `bank_id` |\n| `POST /api/exam/attempts/:id/vote`、`PATCH /attempts/:id/final` | attempt → `bank_id` |\n| `GET /api/exam/shot/:kind/:id` | `score` 走 bank、`upload` 走 upload → `bank_id` |\n\n**C. 上傳通行碼 → 見 §3.5**：`GET`／`POST /api/exam/upload-token`。\n\n### 3.4 `resolveBank` 不得跨公司\n\n沒指定場次時，「還沒結束的那一場」必須限縮在**上傳者自己公司**的場次內；找不到就開一場新的、掛在上傳者的公司底下。\n\n這條不是防禦性補強：現況下客戶傳的第一張圖就會落進內部正在進行的場次，而且**沒有任何徵狀**——內部同事會在自己的作戰台上看到不認識的題目，客戶則以為自己傳成功了。\n\n### 3.5 上傳通行碼改成一家公司一把\n\n現在是全平台一把，存單一檔案、重產即舊的失效。客戶一旦開始用，雙方會互相把對方的碼作廢——**症狀是「我的通行碼昨天還能用」，而 log 上看不出任何異常**。\n\n改成以發放者的公司為鍵（內部為 `internal`）各存一把，檔案結構從單一物件改成以公司為鍵的物件。`checkExamToken` 逐把比對，命中哪一把就用那把的 `issued_by` 當身分（§3.1 的 BYOK 那輪已經在記了）。\n\n### 3.6 前端\n\n- `/exam-bank` 維持 `requiresInternal`（現況正確，後端補上同樣的判準即可）。\n- `/exam-run` 的 `requiresInternal` 改成看 `features.exam`——這條 router meta 的註解明寫它是「刻意保守的近似」，客戶能用之後那個近似就過嚴了。\n- 選單入口已經是 `userStore.features.exam`，不動。\n\n---\n\n## 4. 測試\n\n1. **場次可見性矩陣**（supertest＋pg-mem）：平台管理員／內部成員／甲公司成員／乙公司成員 × 內部場次／甲的場次。看不到一律 404。\n2. **B 類端點逐支**：拿別家公司的場次 id 打過去，全部 404。這一條要能擋住「新增端點時忘了接上檢查」——用掃全檔的靜態守衛列出 B 類清單，漏接就紅。\n3. **A 類端點**：客戶公司成員一律 404，內部 200。\n4. **`resolveBank`**：客戶上傳且內部有一場進行中 → **不得**落進那一場，要另開一場掛在客戶公司。\n5. **通行碼**：甲公司重產不影響乙公司與內部那把；用甲的碼傳的圖落在甲的場次。\n6. **題目池共用（反向確認）**：客戶上傳的題目**會**併進共用池、也**會**用到內部累積的官方答案——這是裁決要的行為，釘住它才不會有人日後「順手修掉」。\n\n---\n\n## 5. 驗收\n\n- 全跑不得有新紅燈（基線動手前自己量）。目前基線是 **403 suites／5922 tests／0 失敗**。\n- **人工**：開一家客戶公司、打開考試功能、以該公司帳號走完「傳一張考卷 → 判題 → 看結果」，確認看不到內部場次、也進不去題庫頁。這一項無法用測試取代——它驗的是「客戶真的用得起來」，而不只是「擋得住」。\n"},{"id":"flow","num":"3","label":"客戶按到底","deps":"前置 0、1、2","file":"2026-09-11-customer-self-serve-flow-design.md","md":"# 客戶自己按到底：關卡與上正式設計（平台產品化 子專案 3）\n\n日期：2026-09-11\n狀態：P1～P5 已於 2026-09-14 裁決；本文是目標設計，實作進度以「開發順序」§0 為準\n前置：子專案 0、1、2\n總覽：`2026-09-11-productize-overview.md`\n\n2026-09-24 程式進度：待上正式清單唯讀與執行權限已分開；公司管理員有 `can_release` 時可確認正式部署；確認視窗補齊提出者／公司／核准時間；規格預設摘要與驗收條件、原始 YAML 只供平台管理員；停下原因對客戶改白話並提供「請平台協助」；合併衝突只有平台管理員可操作並會收到通知。正式部署失敗會通知綁定公司的管理員及平台管理員；共用專案的收件匣只連到收件人可看的任務，沒有可連任務時只送即時／外部通知。上正式合併 main 失敗會通知平台，客戶只看到白話訊息；缺 Git 憑證提示公司設定。完整角色矩陣與正式環境人工驗收仍待完成。\n\n---\n\n## 1. 目標與非目標\n\n### 目標\n\n客戶自己走完整條路，**一般情況不需要平台人員介入**（合併衝突例外，見 §8 P1）：\n提需求 → 回答澄清問題 → 確認規格 → 到測試區驗收（核准或退回）→ 上正式。\n\n### 非目標\n\n- 上正式前的資料庫備份（09-14 裁決不備份，§8 P4）\n- 平台自己的更版（子專案 4）\n- 流程本身的關卡設計（沿用現行 pipeline，不增減關卡）\n\n---\n\n## 2. 已定調的決定\n\n| 決定 | 日期 |\n|---|---|\n| 客戶自己按到底，**包含上正式機** | 09-11 |\n| 客戶管理員按上正式；客戶一般人問答、提需求、驗收 | 09-11 |\n| 上正式前**不備份** DB；確認視窗與條款明寫 | 09-14 |\n| 推 GIT：個人有用個人，沒有用公司的 | 09-11 |\n\n---\n\n## 3. 現況事實（2026-09-11 實查）\n\n### 3.1 人工關卡（`app/public/js/pipeline-spec.js`）\n\n| 關卡 | 狀態 | 端點 |\n|---|---|---|\n| 需補資料 | cs 閘門 | `POST /api/tasks/:id/cs-data-submit` |\n| 等待確認回覆 | cs 閘門 | `cs-confirm`、`cs-followup` |\n| 等待確認 | 分析後問問題 | `POST /api/tasks/:id/answer`、`clarify-ask` |\n| 等待規格確認 | `spec_review` | `spec-approve`、`spec-revise` |\n| 待你裁決 | `clarify_pending` | `answer`、`clarify-ask` |\n| 失敗待確認 | `stopped` | `resolve-blocker`（填修正指示） |\n| 合併衝突 | `merge_conflict` | `resolve-conflicts`、`mark-conflict-resolved`、`merge-clarify` |\n| 等待審核 | `review_pending` | `approve`、`reject` |\n| 🚀 上正式 | 專案層、整批 | `POST /api/projects/:id/release` |\n\n- 任務層端點都經過 `loadTaskForActor`（本人或 admin）。\n- `mark-conflict-resolved` 是「人工手解」：需要有人真的去改衝突檔（`git.js:558-559` 註解）。\n\n### 3.2 核准（approve）\n\n- 按下當下就驗 GIT 憑證（`pipeline-routes.js:57-62`）；push 回 ai-dev 歸屬到按的人（記進 `approved_by`）。\n\n### 3.3 上正式（`project-routes.js:925-1030`）\n\n- 合併 ai-dev → main：用**按的人本人**的 PAT，沒設就擋（930-936）。\n- 部署正式機：要同時滿足 `auto_deploy_enabled`、有啟用的 prod 部署目標、**`isAdminUser`**（997）、`confirmDeploy === true`（1000）。\n- 整批：`approved_at IS NOT NULL AND merged_to_main_at IS NULL` 的任務一起上（969-975）。\n- 部署失敗回滾**只還原檔案，資料庫改動留在原地**（`deploy-run.js:187`，09-08 裁決）。\n- 部署結果已經會寫進任務時間軸（記憶 deploy-fetch-missing-pat，`09a858f4`）。\n\n### 3.4 給人看的文字\n\n- 「給人看的文字有讀者、有出口，不再與工程訊息混流」已進 master（`735c21c5`，設計見 `2026-08-31-plain-output-design.md`）。\n- 當時實測：規格書 `summary` 中位 189 字、13% 超過 400 字；QA 退回與審核分診的訊息術語最多。\n\n### 3.5 測試區\n\n- 客戶驗收要進測試區：SSO 端點 `env-routes.js:102`，閒置時會自動把環境拉起來。\n- 進去時會依平台使用者 JIT 建 Odoo 帳號（記憶 sso-jit-create-hr-attendance-crash）。\n\n---\n\n## 4. 設計\n\n### 4.1 誰能按哪個關卡\n\n| 關卡 | 客戶一般人 | 客戶管理員 | 平台管理員 |\n|---|---|---|---|\n| 需補資料／等待確認回覆 | 自己的任務 ✓ | 自己公司成員的任務 ✓ | ✓ |\n| 等待確認／待你裁決（回答問題） | 自己的任務 ✓ | 自己公司成員的任務 ✓ | ✓ |\n| 等待規格確認 | 自己的任務 ✓ | 自己公司成員的任務 ✓ | ✓ |\n| 失敗待確認 | 自己的任務 ✓（§4.5） | 自己公司成員的任務 ✓ | ✓ |\n| 合併衝突 | ✗ | ✗；由平台處理 | ✓ |\n| 等待審核（核准／退回） | 自己的任務 ✓ | 自己公司成員的任務 ✓ | ✓ |\n| 🚀 上正式 | ✗ | 自己公司綁定有勾「可上正式」的專案 ✓ | ✓ |\n\n任務層的規則全部落在 `loadTaskForActor`（子專案 1 §5.2），這裡不另開檢查。\n\n### 4.2 核准\n\n- 憑證改走子專案 1 §6 的「個人 → 公司」退回 ⇒ 沒設個人 GIT 的客戶也能核准。\n- 時間軸寫明這次是用誰的 GIT 身分推的。\n\n### 4.3 上正式\n\n**權限**：`canReleaseProject(actor, projectId)`（定義在子專案 1 §5.2）＝平台管理員，或公司管理員且自己公司對該專案的綁定 `can_release=true`。\n內部公司的綁定一律不勾（09-14 裁決）⇒ 客戶專案只有該客戶的公司管理員或平台管理員能按。\n共用專案（兩家公司綁同一個專案）時，建議只勾一家；按下去會連另一家已核准的任務一起上線，確認視窗要列出每張任務是哪家公司的人核准的。\n\n| 步驟 | 現在 | 改成 |\n|---|---|---|\n| 誰能按 | 任何登入的人都能合併 main；只有 admin 能部署 | 只有 `canReleaseProject` 為真的人 |\n| 合併 main 的憑證 | 本人 PAT，沒設就擋 | 個人 → 公司退回 |\n| 部署正式的權限檢查 | `isAdminUser`（997） | `canReleaseProject` |\n| `confirmDeploy` | 必須 | 維持必須 |\n| `auto_deploy_enabled` 開關 | 平台管理員（`project-routes.js:499` 已掛 `requireAdmin`） | 維持平台管理員（屬於開通） |\n\n**按下前的確認視窗必須寫清楚**：\n- 這次會一起上線的**每一張任務**：標題、提出者、核准時間（現有 `release-modal.js` 顯示了哪些，計畫階段確認後補齊）\n- 「上正式前**不備份資料庫**；程式檔案失敗會自動還原，**資料庫的改動不會還原**」（§8 P4）\n\n### 4.4 規格給客戶看得懂\n\n- 「等待規格確認」預設**只顯示白話摘要**（`analysis.yaml` 的 `summary`＋驗收條件清單），YAML 原文收合起來，只有平台人員展開得到。\n- 客戶可以用問的：`spec-revise`／spec-review agent 本來就支援「純提問」與「明確修改」兩種（記憶與 agent 說明）。\n- 摘要長度：沿用 `735c21c5` 已做的出口規則；計畫階段抽 20 份現有規格，確認客戶版看起來合格再上。\n\n### 4.5 失敗待確認\n\n- 客戶看到的是**白話的原因**，不是 `blocker_content` 原文（原文收合，只有平台人員展開得到）。\n- 客戶能做的事：填修正指示（沿用 `resolve-blocker`）。\n- 提供「請平台協助」按鈕（§8 P2 已決）。\n\n### 4.6 測試區驗收\n\n- SSO 端點改用 `loadProjectForActor`（子專案 1 §5.3）。\n- 客戶進測試區時維持 Odoo admin 權限；前提是測試區已使用獨立、非超級使用者的 DB 帳號（§8 P3、子專案 1 §10）。\n\n---\n\n## 5. 錯誤處理\n\n| 狀況 | 做法 |\n|---|---|\n| 上正式時合併 main 衝突或失敗 | 維持現行：不標記 `merged_to_main_at`；客戶管理員看到白話說明，並通知平台管理員（這種失敗客戶沒辦法自己處理） |\n| 正式部署失敗 | 檔案自動還原（`deploy-run.js`）；時間軸寫白話；通知客戶管理員**與**平台管理員；明寫資料庫改動未還原 |\n| 客戶沒有個人 GIT、公司也沒綁 | 按鈕當下就擋，訊息「公司尚未設定 GIT，請聯絡平台」 |\n| 公司不可用 | 子專案 1 §5.1，所有按鈕 403 |\n\n---\n\n## 6. 測試\n\n- **角色 × 關卡矩陣**（supertest＋pg-mem）：一般使用者不能上正式；沒綁該專案的公司管理員不能；有綁但沒勾 `can_release` 的不能；有勾的能；內部公司的公司管理員對客戶專案不能；平台管理員全部能。\n- `canReleaseProject` 單元測試（含共用專案：兩家都綁、只勾一家）。\n- 核准與上正式在「沒個人 GIT、有公司 GIT」時能成功，時間軸記錄來源是公司。\n- 確認視窗的任務清單在「開窗後有人又核准一張」時，實際上線的清單以按下當下查的為準（rules/infra 153，現行已如此，補測試鎖住）。\n- 前端人工實測：用客戶一般人、客戶管理員各走一次完整流程（需子專案 0～2 都已完成）。\n\n---\n\n## 7. 會改變的既有行為\n\n- 內部公司的成員（含內部公司的公司管理員）**不能再按上正式的合併 main**（子專案 1：工具改平台管理員限定、內部公司綁定不勾 `can_release`），但平台管理員照舊可以。\n- 上正式合併 main 不再強制本人 PAT。\n\n---\n\n## 8. 已裁決事項\n\n| # | 問題 | 建議 | 其他選項 |\n|---|---|---|---|\n| P1 | **合併衝突**要讓客戶處理嗎？ | **已決 09-14：不讓**。客戶看到「平台處理中」，自動通知平台管理員。「全程不經過你」唯一的例外 | — |\n| P2 | 失敗待確認時，要不要給客戶一個「請平台協助」按鈕？ | **已決 09-14：要** | — |\n| P3 | 客戶進測試區時，Odoo 帳號給什麼權限？ | **已決 09-14：維持現行（與 admin 同群組）**。查到的前提：測試區用平台的 PG 超級使用者連線，admin 能寫伺服器動作跑 Python ⇒ 必須先做子專案 1 §10「每個測試區獨立 DB 帳號」 | — |\n| P4 | 上正式前的資料庫備份 | **已決 09-14：不備份**。確認視窗要明寫「上正式不會備份資料庫，出問題只能退程式碼」；服務條款（子專案 4 O10）寫明責任 | — |\n| P5 | 客戶一般人看得到「待上正式」清單嗎？ | **已決 09-14：看得到（唯讀）** | — |\n"},{"id":"ops","num":"4","label":"上線營運","deps":"大部分在 3 之後","file":"2026-09-11-saas-operations-design.md","md":"# SaaS 上線營運設計（平台產品化 子專案 4）\n\n日期：2026-09-11\n狀態：O1～O10 已於 2026-09-14 裁決；§3 是 09-11 歷史基線，實作進度以「開發順序」§0 為準\n前置：子專案 0～3（其中 §4.4 平台 DB 備份不依賴任何子專案，可以最先做）\n總覽：`2026-09-11-productize-overview.md`\n\n---\n\n## 1. 目標與非目標\n\n### 目標\n\n讓平台能**長期**對外營運：開通、訂閱、平台自己的更版、備份、容量、監控、客戶離開、條款。\n\n### 非目標\n\n- 客戶專案（Odoo）的備份——那是子專案 3 §8 P4\n- 金流系統本身的實作細節（先決定要不要串，§6）\n\n---\n\n## 2. 已定調的決定\n\n| 決定 | 日期 |\n|---|---|\n| 開通由平台管理員代設 | 09-11 |\n| 公司有啟用開關＋使用期間，走訂閱制 | 09-11 |\n| 夜間改善變成「客戶提建議的管道」，改完**不能馬上上線**，要有平台更版機制 | 09-11 |\n| 客戶自帶 API key，平台只收服務費 | 09-11 |\n\n---\n\n## 3. 現況事實（2026-09-11 實查）\n\n### 3.1 夜間改善會自動上線\n\n- 健檢提案經 `nightly-fix.js:144`（`inAutoFixScope`）**自動入選，不經人工**；意見回饋要 admin 核准。\n- `teams_settings.cli_push_user_id` 已設 ⇒ `adoptFix → applyFix` 自動合併進平台 master。\n- 合併後直接 `docker restart` 平台容器（`finding-fix.js:483-597`）。\n\n### 3.2 平台重啟會影響客戶\n\n- 測試區的資料庫住在平台容器裡（8772；`ss` 實查監聽 `127.0.0.1` 與 `10.0.0.1`）。\n- 記憶 testenv-disconnect-from-platform-restart：平台重啟 → 測試區 bus 停約 50 秒可自癒，但 **Odoo 的 cron 執行緒會永久死掉，要整個 Odoo 重開**。\n- 在飛的 AI 會被砍（`runner.js:574`；子專案 0 之後變成容器殘留，需啟動時清掉）。\n\n### 3.3 平台資料庫沒有備份\n\n- `pg_dump` 在 `docker/`、`scripts/`、`cron.js`、`upgrade.sh`、`DEPLOY.md` 都找不到。\n- 資料在 docker volume `odoo-v2_pgdata`。\n- rules/infra 121：搬 DB 必須連 `data/config.json` 的 `APP_SECRET` 一起搬，否則所有 `*_enc` 欄位（SSH 密碼、PAT、未來的客戶 API key）全部報廢。\n- 有客戶之後，**所有客戶的任務、規格、對話、連線設定都在這個資料庫裡**。\n\n### 3.4 容量\n\n- 測試區埠池：`PROJECT_PORT_MIN`／`MAX` ＝ 21000–21099（`data/config.json`）。\n- rules/infra 123 記錄 NAT 只轉發 21000–21012——這條可能已因子網域模式過時（記憶 external-access-decision），**要重新量**，不能直接引用。\n- 目前 17 個專案、16 個測試區、執行中 1 個；平台是單一實例（記憶 multi-instance-shared-ai-dev）。\n\n### 3.5 其他\n\n- 刪專案逐表刪 `tasks` 系列與 `projects`（`project-routes.js:551` 起）；其餘表靠 CASCADE／SET NULL，沒有一份完整的「客戶離開要清哪些」清單。\n- pipeline agent 的 `console.error` 不進 docker logs（記憶 pipeline-errors-not-in-docker-log）。\n- 健檢的綠燈有虛胖問題（記憶 health-check-green-is-hollow）。\n- 共用 nginx 的 443 沒有 `default_server`，conf 少一塊時測試區網域會拿到別的站的憑證（記憶 nginx-443-default-server-floats；當時使用者裁決不修）。\n- 自助註冊存在（`auth.js:101`）。\n- 通知管道：`notify.js` 可註冊 channel，已有 Teams webhook（`notify-webhook.js`）。\n\n---\n\n## 4. 設計\n\n### 4.1 開通流程\n\n平台管理員照順序做，新增一個「公司開通」頁顯示每一步有沒有完成：\n\n1. 建公司：名稱、使用期間、啟用\n2. 建公司管理員帳號\n3. 建專案（自動綁內部公司）並綁到客戶公司，決定勾不勾「可上正式」\n4. 綁公司 GIT（子專案 1 §6，會驗每個 repo 可存取）\n5. 加 repo、DB 連線、正式機部署目標（沿用現有頁面）\n6. 建測試區\n7. 客戶管理員登入、填 API key（子專案 2），驗證通過\n8. 用一張小任務走完整條流程，確認通了才交給客戶\n\n### 4.2 訂閱\n\n- 資料：`companies.is_active`、`active_from`、`active_until`（子專案 1 §4.1）。\n- 擋的地方：子專案 1 §7 的檢查點。\n- 到期前通知客戶管理員與平台管理員（天數見 §6）。\n- **09-24 程式進度**：每小時掃描啟用中的客戶公司，在剩餘 14 天與 3 天門檻各發一次即時／webhook 提醒；以公司、到期時間與門檻去重，延長到期時間後可重新提醒。使用者選擇方案 1：平台管理員的公司管理頁、公司管理員的公司帳號頁，在到期前 14 天內持續顯示到期警示，續期後重新載入即消失；公司管理員查詢由登入身分限定自己的公司，不重建個人收件匣，也不保留逐人已讀紀錄。相關自動化測試通過；全套 Jest 受 Windows `pgPass is not a function` 錯誤影響而未完成。尚未上正式環境驗證。\n- 第一版**不串金流**：平台管理員收到款項後手動延長 `active_until`（見 §6）。\n\n### 4.3 平台更版機制\n\n**目的**：平台的改動不再「合併就立刻重啟」，而是累積、測過、挑時間一起上。\n\n| 項目 | 現在 | 改成 |\n|---|---|---|\n| 夜間改善產出 | 自動合併 master＋重啟 | 通過審核後仍自動合併 master，**重啟延後至維護時段**（R6） |\n| 健檢提案 | 自動入選 | **一律先由平台管理員核准**才進夜間改善（R6；09-15 已上線） |\n| 合併進 master | 自動 | **維持自動合併**，不經更版頁人工合併（R6 已決） |\n| 測試 | 每條修正各自跑 | 維護時段重啟前，對 master 再跑一次全套測試；紅了不重啟並通知平台管理員 |\n| 重啟 | 合併後立刻 | 平台管理員選的維護時段 |\n| 重啟後 | — | 自動重開所有執行中的測試區 Odoo（因為 cron 執行緒會死，§3.2） |\n| 通知客戶 | — | 維護前在畫面上方掛公告 |\n\n`applyFix` 的合併與重啟分開：合併自動做，重啟等每週六、日的維護時段（O6）。重啟後自動重開測試區 Odoo，維護前先公告。\n\n**這一塊同時是提示詞注入的防線（總覽 §6.2 I1）**：人擋在入口（核准提案／意見），出口（合併）不擋。所以：\n\n- 核准頁要顯示**會送給 AI 的完整文字**，不是摘要——藏起來的指令只會出現在全文裡。\n- 改碼的 AI 只讀得到核准過的文字（0 §4.5，R6-A）。\n- 合併後留紀錄可回查（R6-B）：`finding_fixes` 已存 `diff`、`review_notes`、`verify_notes`、`commit_sha`，管理頁 `GET /api/admin/health-check/findings/:id/fix` 讀得到（`admin-routes.js:734-744`，只回最新一筆）；**計畫階段確認意見回饋來源的修正也看得到、且看得到歷史每一筆**。\n- fix-review、fix-verify 仍保留，但它們是 AI，可能被同一段文字騙，**不算人工閘**。\n維護時段、頻率見 §6。\n\n### 4.4 平台資料庫備份（可以最先做）\n\n- 每天 `pg_dump` 平台 DB（`aidev`，埠 8772；09-15 更正，原寫 `claude` 是錯的）。\n- **09-15 實作**：平台 cron 臺灣時間每日 04:00（`lib/platform-backup.js`），`data/backups/platform-db-YYYYMMDD.dump`，留 14 天；失敗走 webhook／Teams（這台兩者都沒設），所以排程頁顯示「最近一次成功」與超過一天的警告。首次還原演練 09-15 通過（51 表、筆數一致、8 個加密欄位解得開、錯金鑰解不開）。每月演練尚未自動化。\n- **`APP_SECRET` 另外保存**：沒有它，備份裡的加密欄位全部解不開（rules/infra 121）。備份檔與 `APP_SECRET` 放不同位置。\n- 保留天數、異地位置見 §6。\n- **每月做一次還原演練**：還原到一個空的測試資料庫，確認能開、加密欄位解得開。沒演練過的備份不算有備份。\n- 備份失敗要通知平台管理員（§4.6）。\n\n### 4.5 容量\n\n- 上線前實測：這台機器能同時跑幾個 AI 容器＋幾個測試區（CPU、記憶體、磁碟）。\n- 重新確認測試區對外埠與 NAT 範圍（§3.4），不沿用 rules/infra 123 的舊數字。\n- 超過就排隊：沿用現有派工併發上限（rules/pipeline 64 的即時核對）。每家公司要不要有自己的上限，見 §6。\n\n### 4.6 監控與告警\n\n最小版，全部走既有 `notify` channel 通知平台管理員：\n\n| 事件 | 來源 |\n|---|---|\n| AI 容器啟動失敗、docker／閘道不可用 | 子專案 0 |\n| 閘道拒絕連線次數異常 | 子專案 0 的閘道 log |\n| 公司 API key 失敗 | 子專案 2 |\n| 正式部署失敗 | 子專案 3 |\n| 平台 DB 備份失敗 | §4.4 |\n| 公司即將到期 | §4.2 |\n\n### 4.7 客戶離開\n\n**第一版只停用，不刪除任何東西**（2026-09-24 使用者裁決）。專案只有在人主動去刪專案時才刪；資料要不要清，等資料量真的多起來再回來確認。\n\n**這一版不需要新程式——停用那條路已經完整**（09-24 實查）：\n\n| 停用公司之後 | 在哪裡擋 |\n|---|---|\n| 所有工作台 API 回 403 | `index.js:209` 的公司不可用閘門（規格 §7） |\n| AI 不再跑（連客戶自己的 key 也不給用） | `lib/claude-auth.js` 的 `buildClaudeAuthEnv` 丟 `NO_ANTHROPIC_KEY` |\n| 不再用他們的 GIT 憑證 | `lib/git-identity.js` 的 `isUserCompanyUsable` |\n| 正在跑的任務**只中止那家公司的**，並寫一行看得懂的時間軸 | `company-deactivate-abort` 那一套（4 支測試） |\n\n#### 為什麼把「刪除」拿掉（09-24 實查的三個發現）\n\n1. **所有 17 個專案都綁著「內部」**（一次性遷移的產物）。所以任何客戶專案天生就是「兩家同時綁著」，原文「刪除該公司全部專案」照字面做會刪掉**鴻久**——那是我們自己在維護的。而程式分不出「內部只是遷移時被綁上」與「內部真的在用」。\n2. **刪除順序不能靠 CASCADE**。全庫 54 張表、61 條外鍵，`tasks → projects`、`task_events/logs/messages/specs/attachments → tasks`、`sessions/loop_counter/project_chats/tasks → users` 全是 `NO ACTION`，不照順序刪會被資料庫直接擋住。\n3. **`tasks.user_id` 是 `NOT NULL`**，所以「留著任務、只抹掉人名」在現有 schema 上走不通，要改欄位並盤查全庫所有假設「任務一定有建立者」的地方（最危險的是 `INNER JOIN users`——那會讓去識別的任務整批從清單上消失）。\n\n原文第 3 點「`token_usage` 保留但去識別」**本來就成立，不必另外做**：`token_usage.company_id` 是沒有外鍵的純 INTEGER，刪公司那一列之後數字還留著；`token_usage.user_id` 是 `ON DELETE SET NULL`，刪帳號時自動變空。\n\n#### 真的要做刪除時，從這裡接\n\n本節原本要求「計畫階段逐表列出完整清單」。那份清單還是不存在，但**上面三個發現就是它的前置條件**——先解掉「共用專案怎麼分辨」與「`tasks.user_id` 要不要可為 NULL」這兩個問題，再列表。保留期與資料匯出見 §6（O5 已決：第一版不提供匯出）。\n\n### 4.8 條款與責任（不是程式，上線前一定要有）\n\n服務條款至少要涵蓋：\n\n- 客戶自己按上正式造成的損害，責任歸屬\n- 上正式前的資料庫備份政策（依子專案 3 P4 的結論寫）\n- AI 產出程式碼的責任範圍\n- AI 用量費用由客戶與 Anthropic 直接結算（子專案 2）\n- 資料保留與刪除（§4.7）\n\n另外：產品名稱、logo 不能含 Claude Code／Anthropic 字樣（子專案 2 §3.1）。\n\n### 4.9 客戶建議怎麼變成平台改動\n\n客戶「提意見」→ 平台管理員核准 → 夜間改善改碼、審核 → 自動合併 master → 維護時段測試、重啟（§4.3）。\n人擋入口、不擋合併出口是 R6 的明確裁決；不得再把它寫成「進待更版清單、等待人工合併」。\n\n---\n\n## 5. 測試\n\n- 更版：夜間改善通過審核後 master **有**新 commit，但平台尚未重啟；維護時段全套測試紅 → 不重啟並通知平台管理員。\n- 重啟後自動重開測試區 Odoo：用一個執行中的測試區驗證 cron 有恢復。\n- 備份：還原演練腳本本身就是測試（還原 → 解一個 `*_enc` 欄位成功）。\n- 訂閱到期：`active_until` 設成過去時間 → 子專案 1 的檢查點全部生效。\n- 客戶離開：刪除後，用該公司的 id 對每張表查，全部 0 筆（去識別的 `token_usage` 除外）。\n\n---\n\n## 6. 已裁決事項\n\n| # | 問題 | 建議 |\n|---|---|---|\n| O1 | 金流：第一版要不要串線上付款？ | **已決 09-14：不串**，平台管理員手動延長使用期間 |\n| O2 | 方案與價格怎麼分？ | **已決 09-14：每家公司固定月費**（AI 費用客戶直接付 Anthropic）⇒ 程式只管「能不能用」，不做帳號數／專案數計數 |\n| O3 | 到期前幾天通知？ | **已決 09-14：14 天、3 天各一次**，通知公司管理員與平台管理員 |\n| O4 | 到期或解約後資料保留多久再刪？ | **已決 09-14：不自動刪**，由平台管理員手動決定何時執行 §4.7 刪除流程；條款照寫 |\n| O5 | 客戶離開前要不要提供資料匯出？ | **已決 09-14：第一版不做**，有需要由平台管理員手動匯出 |\n| O6 | 平台更版的維護時段與頻率？ | **已決 09-14：每週六、日**。取代現行「夜間改善合併後馬上 `docker restart`」 |\n| O7 | 平台 DB 備份存到哪、留幾天？ | **已決（09-14）**：先放這台、留 14 天，之後再搬到別處 |\n| O8 | 每家公司要不要有自己的同時執行上限？ | **已決 09-14：要，每家公司各自一個上限**（使用者理由：每家有自己的 key，Anthropic 限流本來就分開）。數值等 §4.5 容量量完再訂。注意：key 分開只分開 Anthropic 的限流，這台主機的 CPU／記憶體仍是共用，總上限仍要保留 |\n| O9 | nginx 443 `default_server` 客戶上線前要不要重新評估？ | **已決 09-14：客戶上線前要修**；同時評估是否讓客戶用自己的網域 |\n| O10 | 服務條款由誰擬？ | **已決 09-14：自己擬**。必寫：AI 費用客戶直接付 Anthropic、上正式由客戶自按且不備份 DB、資料不自動刪除、維護時段週六日 |\n"}];
  const STORE_KEY = 'odoo-v2-saas-specs:last';

  const docList = document.getElementById('docList');
  const tocEl = document.getElementById('toc');
  const docEl = document.getElementById('doc');
  const footEl = document.getElementById('docFoot');

  function countDecisions(md) {
    // 算「待你決定」那一節底下的表格列數（到下一個 ## 為止）
    const lines = md.split('\n');
    let inZone = false, n = 0;
    for (const line of lines) {
      if (/^## /.test(line)) inZone = line.includes('待你決定');
      // 已經裁決的列（含「已決」）不算待決
      else if (inZone && /^\|/.test(line) && !/^\|\s*[-:|\s]+\|?\s*$/.test(line) && !line.includes('已決')) n++;
    }
    // 每張表的表頭列不算
    const headers = md.split(/\n(?=## )/).filter(s => /^## .*待你決定/.test(s))
      .map(s => (s.match(/\n\|[^\n]*\n\|\s*[-:|\s]+\|/g) || []).length)
      .reduce((a, b) => a + b, 0);
    return Math.max(0, n - headers);
  }

  function renderList(activeId) {
    docList.innerHTML = '';
    for (const d of DOCS) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'doc-link';
      a.href = '#' + d.id;
      if (d.id === activeId) a.setAttribute('aria-current', 'page');
      const num = document.createElement('span');
      num.className = 'doc-num';
      num.textContent = d.num === '' ? '＊' : d.num;
      const title = document.createElement('span');
      title.className = 'doc-title';
      title.textContent = d.label;
      const deps = document.createElement('span');
      deps.className = 'doc-deps';
      deps.textContent = d.deps;
      a.append(num, title);
      const c = countDecisions(d.md);
      if (c > 0) {
        const badge = document.createElement('span');
        badge.className = 'doc-count';
        badge.textContent = c + ' 項待決';
        a.append(badge);
      }
      a.append(deps);
      li.append(a);
      docList.append(li);
    }
  }

  function renderDoc(id, anchor) {
    const idx = Math.max(0, DOCS.findIndex(d => d.id === id));
    const d = DOCS[idx];
    renderList(d.id);
    try { localStorage.setItem(STORE_KEY, d.id); } catch (e) { /* 無儲存空間也照常顯示 */ }

    docEl.innerHTML = marked.parse(d.md, { gfm: true, breaks: true });

    // 表格包一層可橫向捲動的容器
    docEl.querySelectorAll('table').forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.append(t);
    });

    // 標題 id、目錄、「待你決定」標記
    tocEl.innerHTML = '';
    let zone = null;
    const heads = docEl.querySelectorAll('h2, h3');
    let h2i = 0, h3i = 0;
    heads.forEach(h => {
      if (h.tagName === 'H2') { h2i++; h3i = 0; h.id = d.id + '-s' + h2i; }
      else { h3i++; h.id = d.id + '-s' + h2i + '-' + h3i; }
    });
    Array.from(docEl.children).forEach(node => {
      if (node.tagName === 'H2') {
        zone = node.textContent.includes('待你決定') ? node : null;
        if (zone) {
          node.classList.add('is-decision');
          const c = countDecisions(d.md);
          if (c > 0) node.dataset.count = c + ' 項等你決定';
        }
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + d.id + '/' + node.id;
        a.textContent = node.textContent;
        if (zone) a.classList.add('is-decision');
        li.append(a);
        tocEl.append(li);
      } else if (zone && node.classList && node.classList.contains('table-wrap')) {
        node.parentNode.insertBefore(document.createElement('div'), node);
        const holder = node.previousSibling;
        holder.className = 'decision-zone';
        holder.append(node);
      }
    });

    // 上一份／下一份
    footEl.innerHTML = '';
    const prev = DOCS[idx - 1], next = DOCS[idx + 1];
    if (prev) footEl.append(footLink(prev, '上一份', 'prev'));
    if (next) footEl.append(footLink(next, '下一份', 'next'));

    if (anchor) {
      const target = document.getElementById(anchor);
      if (target) { target.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
  }

  function footLink(d, label, cls) {
    const a = document.createElement('a');
    a.href = '#' + d.id;
    a.className = cls;
    const s = document.createElement('small');
    s.textContent = label;
    const t = document.createElement('span');
    t.textContent = (d.num === '' ? '' : d.num + '　') + d.label;
    a.append(s, t);
    return a;
  }

  function route() {
    const raw = decodeURIComponent(location.hash.slice(1));
    let [id, anchor] = raw.split('/');
    if (!id) {
      try { id = localStorage.getItem(STORE_KEY) || 'overview'; } catch (e) { id = 'overview'; }
    }
    renderDoc(id, anchor);
  }

  window.addEventListener('hashchange', route);
  route();
</script>
