services:
  odoo-v2:
    build: .
    image: odoo-v2:latest
    container_name: odoo-v2
    # host 網路：容器內外的埠與 127.0.0.x loopback 完全同構。這是三件事的前提——
    # (1) 平台連得到測試區綁的 127.0.0.x；(2) 測試區的 host.docker.internal:8772 指得到平台 PG；
    # (3) 配埠時的 bind 探測看得到宿主真實佔用。
    network_mode: host
    restart: unless-stopped
    volumes:
      # 平台建立測試區 sibling 容器用的宿主 socket。
      - /var/run/docker.sock:/var/run/docker.sock
      # 同構掛載（宿主路徑 === 容器路徑），見 .env.example 的說明。
      - ${HOST_REPO_DIR}:${HOST_REPO_DIR}
      - ${HOST_ENV_BASE}:${HOST_ENV_BASE}
      # claude 訂閱登入憑證與 PG 資料：不得隨容器重建而消失。
      - claude-home:/home/odoo/.claude
      - pgdata:/var/lib/postgresql/data
    working_dir: ${HOST_REPO_DIR}
    environment:
      APP_DIR: ${HOST_REPO_DIR}
      ODOO_ENV_BASE: ${HOST_ENV_BASE}
      # 容器預設 UTC，會讓 cron.js 的測試區夜間關機（預設 23:00）落在台灣早上 7 點——
      # 正好是上班時間，症狀是「一早進來測試區全被關掉」，不會有任何錯誤。
      TZ: ${TZ:-Asia/Taipei}
      # 測試區對外用（未設則維持每專案 127.0.0.x 直連，本機開發行為不變）。見 .env.example。
      ENV_BIND_HOST: ${ENV_BIND_HOST:-}
      ENV_PUBLIC_URL_TEMPLATE: ${ENV_PUBLIC_URL_TEMPLATE:-}
      # port 模式反代（全 opt-in）：NGINX_SYNC_CONF_FILE 是總 gate，連同下列一起設齊才會自動
      # 寫入每個 running 測試區的 ssl server block。NGINX_SYNC_CONF_FILE 須為 odoo-v2 寫得到、
      # 且已 include 進 agency-NginxUI-1 之 http{} 的共享路徑（雙容器 bind mount 同一宿主檔）。
      NGINX_CONTAINER: ${NGINX_CONTAINER:-}
      NGINX_SYNC_CONF_FILE: ${NGINX_SYNC_CONF_FILE:-}
      ENV_TLS_CERT: ${ENV_TLS_CERT:-}
      ENV_TLS_KEY: ${ENV_TLS_KEY:-}

volumes:
  claude-home:
  pgdata:
